name: Atlas HRA isolated private cache contract
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
    paths:
      - 'scripts/load-hra-priority-isolated.mjs'
      - 'scripts/load-hra-priority-isolated.test.mjs'
      - 'scripts/stage-hra-priority-local.py'
      - '.github/workflows/atlas-hra-priority-cache.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/stage-hra-priority-local.py
      - run: node --test scripts/load-hra-priority-isolated.test.mjs
