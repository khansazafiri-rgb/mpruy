name: Atlas digestive, held lymph, knee and larynx source audit
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
    paths:
      - 'licensing/atlas-publication/hra-digestive-six-pinned-candidates-20261127.json'
      - 'licensing/atlas-publication/hra-lymph-model-two-pinned-candidates-20261127.json'
      - 'licensing/atlas-publication/hra-knee-larynx-six-pinned-candidates-20261127.json'
      - 'licensing/atlas-publication/hra-tonsil-four-pinned-candidates-20261127.json'
      - 'licensing/atlas-publication/hra-pelvis-two-pinned-candidates-20261127.json'
      - 'scripts/audit-hra-female-five.mjs'
      - '.github/workflows/atlas-hra-digestive-source.yml'
# Supersede only an older revision of the same workflow on the same ref.
concurrency:
  group: atlas-hra-digestive-source-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [digestive-six, lymph-model-two, knee-larynx-six, tonsil-four, pelvis-two]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/audit-hra-female-five.test.mjs
      - name: Verify publisher bytes and native hierarchy in the same job
        if: matrix.batch == 'knee-larynx-six'
        run: node scripts/audit-hra-female-five.mjs knee-larynx-six --fresh-groups
      - name: Verify remaining pinned source batches
        if: matrix.batch != 'knee-larynx-six'
        run: node scripts/audit-hra-female-five.mjs ${{ matrix.batch }}
