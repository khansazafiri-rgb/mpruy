name: Atlas new digestive and held lymph model source audit
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
    paths:
      - 'licensing/atlas-publication/hra-digestive-six-pinned-candidates-20261127.json'
      - 'licensing/atlas-publication/hra-lymph-model-two-pinned-candidates-20261127.json'
      - 'scripts/audit-hra-female-five.mjs'
      - '.github/workflows/atlas-hra-digestive-source.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [digestive-six, lymph-model-two]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/audit-hra-female-five.test.mjs
      - run: node scripts/audit-hra-female-five.mjs ${{ matrix.batch }}
