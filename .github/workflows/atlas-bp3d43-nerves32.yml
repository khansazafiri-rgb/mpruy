name: Atlas 4.3 nerve expansion dual-source audit
on:
  pull_request:
    branches: [feat/atlas-integrated-private-20261125]
    paths:
      - 'licensing/atlas-publication/bp3d43-nerves32-candidates.json'
      - 'scripts/audit-bp3d43-gap-batch.mjs'
      - '.github/workflows/atlas-bp3d43-nerves32.yml'
permissions:
  contents: read
jobs:
  nerve-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - name: Existing strict identity and geometry tests
        run: node --test scripts/intake-bp3d43-priority-elements.test.mjs scripts/audit-bp3d43-mirror-elements.test.mjs scripts/audit-bp3d43-gap-batch.test.mjs
      - name: Audit 32 candidate nerve elements using publisher and pinned mirror
        run: node scripts/audit-bp3d43-gap-batch.mjs nerves-32
      - name: Remove private temporary geometry
        if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-* local-data/licensing-quarantine/bp3d43-mirror-audit-*
