name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/anatomy/package-lock.json
            apps/4d-lab/package-lock.json
      - run: npm ci
      - name: Install Anatomy viewer
        run: npm ci --prefix apps/anatomy
      - name: Lint
        run: npm run lint
      - name: Tes unit (konten kaya + format impor)
        run: npm test
      - name: Build web
        run: npm run build
      - name: Hermes delivery and import workflows
        run: npm run check --prefix apps/hermes-agent && npm test --prefix apps/hermes-agent
      - name: Anatomy release and host integration
        run: npm run test:anatomy-integration
      - name: Licence quarantine (withheld anatomy is absent and cannot be served)
        run: npm run test:licensing
      - name: Anatomy viewer tests and lint
        run: npm run test:anatomy && npm run lint:anatomy
      - name: Build Anatomy viewer
        env:
          ANATOMY_BASE: /anatomy/viewer/
        run: npm run build --prefix apps/anatomy
      - name: 4D Lab tests and build (Anatomy Live)
        run: |
          npm ci --prefix apps/4d-lab
          npm run test:4d-lab
          npm run build:4d-lab
      - name: Licence quarantine scan of the built artifacts
        run: npm run check:licensing-dist -- apps/anatomy/dist apps/4d-lab/dist
      - name: Tes API per peran
        working-directory: apps/pocketbase
        run: |
          bash scripts/download-pocketbase.sh
          ./pocketbase migrate up --dir=./pb_data --migrationsDir=./pb_migrations --hooksDir=./pb_hooks
          ./pocketbase superuser upsert ci@medcoel.test ci-password-123 --dir=./pb_data
          MEDCOEL_DEV_MODE=1 ./pocketbase serve --http=127.0.0.1:8090 --dir=./pb_data --migrationsDir=./pb_migrations --hooksDir=./pb_hooks --hooksWatch=false &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 1; done
          PB_SU_EMAIL=ci@medcoel.test PB_SU_PASSWORD=ci-password-123 node test/api.test.mjs
          PB_SU_EMAIL=ci@medcoel.test PB_SU_PASSWORD=ci-password-123 node test/lab-api.test.mjs
          # Isolate materi fixtures: they intentionally populate Drilling and
          # would invalidate the earlier API suite's empty-state assumptions.
          DECK_DB=$(mktemp -d)
          ./pocketbase migrate up --dir="$DECK_DB" --migrationsDir=./pb_migrations --hooksDir=./pb_hooks
          ./pocketbase superuser upsert ci@medcoel.test ci-password-123 --dir="$DECK_DB"
          MEDCOEL_DEV_MODE=1 ./pocketbase serve --http=127.0.0.1:8091 --dir="$DECK_DB" --migrationsDir=./pb_migrations --hooksDir=./pb_hooks --hooksWatch=false &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8091/api/health && break; sleep 1; done
          PB_URL=http://127.0.0.1:8091 PB_SU_EMAIL=ci@medcoel.test PB_SU_PASSWORD=ci-password-123 node test/decks-api.test.mjs
