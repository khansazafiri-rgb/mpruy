name: Clinical Studios final integration

on:
  pull_request:
    branches: [claude/focused-wozniak-1ayrxa]
    paths:
      - 'apps/studios/**'
      - 'apps/4d-lab/**'
      - 'apps/pocketbase/**'
      - 'packages/studio-contract/**'
      - 'licensing/**'
      - 'scripts/studio-*.mjs'
      - 'docs/clinical-studios/**'
      - '.github/workflows/studios-integration.yml'

permissions:
  contents: read

jobs:
  studios-browser:
    name: 24 studios — integration guards and fixture browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      STUDIOS_INTEGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studios/package-lock.json
      - name: Install locked application dependencies
        run: |
          npm ci
          npm ci --prefix apps/studios
      - name: Install isolated browser test tooling (no repository dependency changes)
        run: |
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/medcoel-browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/medcoel-browser-tools/node_modules" >> "$GITHUB_ENV"
          echo "STUDIO_INTEGRATION_REPORT=$RUNNER_TEMP/studio-integration-results.json" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/medcoel-browser-tools" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/medcoel-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build all 24 applications with labelled technical fixtures only
        run: |
          set -o pipefail
          node apps/studios/scripts/build-all.mjs 2>&1 | tee "$RUNNER_TEMP/studio-builds.log"
      - name: Verify ancestry, unchanged legacy, closed clearance and exact manifests
        run: |
          set -o pipefail
          node --test scripts/studio-final-integration.test.mjs 2>&1 | tee "$RUNNER_TEMP/studio-integration-guards.log"
      - name: Browser smoke — all 24 studios, Explore and Guided
        run: |
          set -o pipefail
          node apps/studios/test/all-studios.e2e.mjs 2>&1 | tee "$RUNNER_TEMP/studio-browser-smoke.log"
      - name: Browser Guided regression — shared 2D and volume engines
        run: |
          set -o pipefail
          node apps/studios/test/engines-guided.e2e.mjs 2>&1 | tee "$RUNNER_TEMP/studio-guided-browser.log"
      - name: Save technical test evidence only (never upload medical resources or dist)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-integration-technical-results-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/studio-integration-results.json
            ${{ runner.temp }}/studio-builds.log
            ${{ runner.temp }}/studio-integration-guards.log
            ${{ runner.temp }}/studio-browser-smoke.log
            ${{ runner.temp }}/studio-guided-browser.log
          retention-days: 14

  legacy-4d-browser:
    name: 4D UX browser — ${{ matrix.revision }} (failures remain visible)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        revision: [base, integrated]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/4d-lab/package-lock.json
      - name: Use the same assertion harness for target and integration
        env:
          BROWSER_HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$BROWSER_HARNESS_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BROWSER_HARNESS_SHA"
          git show "$BROWSER_HARNESS_SHA:apps/4d-lab/test/e2e/ux-e2e.mjs" > "$RUNNER_TEMP/medcoel-4d-ux.mjs"
          cp "$RUNNER_TEMP/medcoel-4d-ux.mjs" apps/4d-lab/test/e2e/ux-e2e.mjs
      - name: Remove historical results and bind the browser run to this checkout
        env:
          BROWSER_REVISION: ${{ matrix.revision }}
          BROWSER_HARNESS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import crypto from 'node:crypto';
          const dir = 'apps/4d-lab/evidence/';
          fs.mkdirSync(dir, { recursive: true });
          for (const name of ['ux-e2e-results.json', 'integration-browser-proof.json'])
            fs.rmSync(dir + name, { force: true });
          fs.writeFileSync(dir + 'integration-browser-start.json', JSON.stringify({
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            revision: process.env.BROWSER_REVISION, startedAt: Date.now(),
            harnessCommit: process.env.BROWSER_HARNESS_SHA,
            harnessSha256: crypto.createHash('sha256').update(fs.readFileSync('apps/4d-lab/test/e2e/ux-e2e.mjs')).digest('hex'),
            commit: execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim()
          }));
          JS
      - name: Install locked 4D application and isolated browser tooling
        run: |
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/medcoel-browser-tools/node_modules/playwright" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/medcoel-browser-tools/node_modules" >> "$GITHUB_ENV"
          npm ci --prefix apps/4d-lab
          npm install --prefix "$RUNNER_TEMP/medcoel-browser-tools" --no-save --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/medcoel-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build the unchanged 4D application
        run: npm run build:4d-lab
      - name: Run unmodified legacy UX browser assertions
        run: |
          set +e
          set -o pipefail
          node apps/4d-lab/test/e2e/ux-e2e.mjs 2>&1 | tee "$RUNNER_TEMP/4d-ux.log"
          test_exit_code=$?
          printf '%s\n' "$test_exit_code" > "$RUNNER_TEMP/4d-ux-exit-code"
          exit "$test_exit_code"
      - name: Verify fresh evidence (never accept a tracked historical result)
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const dir = 'apps/4d-lab/evidence/';
          const start = JSON.parse(fs.readFileSync(dir + 'integration-browser-start.json', 'utf8'));
          const bytes = fs.readFileSync(dir + 'ux-e2e-results.json');
          const result = JSON.parse(bytes);
          const code = Number(fs.readFileSync(process.env.RUNNER_TEMP + '/4d-ux-exit-code', 'utf8').trim());
          assert.equal(start.runId, process.env.GITHUB_RUN_ID);
          assert.equal(start.attempt, process.env.GITHUB_RUN_ATTEMPT);
          assert.equal(start.harnessSha256, crypto.createHash('sha256').update(fs.readFileSync('apps/4d-lab/test/e2e/ux-e2e.mjs')).digest('hex'));
          assert.ok(Date.parse(result.date) >= start.startedAt, 'Historical result refused');
          assert.ok(fs.statSync(dir + 'ux-e2e-results.json').mtimeMs >= start.startedAt);
          assert.equal(result.results.length, 16, 'All original UX assertions must execute');
          assert.equal(result.failed, result.results.filter(x => !x.ok).length);
          assert.equal(result.passed, result.results.filter(x => x.ok).length);
          assert.equal(code, result.failed ? 1 : 0, 'Exit code/result disagreement');
          const proof = { ...start, finishedAt: Date.now(), exitCode: code,
            resultSha256: crypto.createHash('sha256').update(bytes).digest('hex'),
            passed: result.passed, failed: result.failed };
          fs.writeFileSync(dir + 'integration-browser-proof.json', JSON.stringify(proof, null, 2));
          console.log('Fresh browser evidence: ' + JSON.stringify(proof));
          JS
      - name: Save actual results even when assertions fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4d-ux-${{ matrix.revision }}-attempt-${{ github.run_attempt }}
          path: |
            apps/4d-lab/evidence/ux-e2e-results.json
            apps/4d-lab/evidence/integration-browser-proof.json
            ${{ runner.temp }}/4d-ux.log
          retention-days: 14

  compare-legacy-browser:
    name: Compare 4D failures against the same-run target baseline
    if: always()
    needs: legacy-4d-browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 4d-ux-*-attempt-${{ github.run_attempt }}
          path: results
      - name: Fail if results are missing, stale or any new UX assertion fails
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const find = (dir, target = 'ux-e2e-results.json') => fs.readdirSync(dir, {withFileTypes: true}).flatMap(e => {
            const p = dir + '/' + e.name;
            return e.isDirectory() ? find(p, target) : e.name === target ? [p] : [];
          });
          const read = revision => {
            const files = find('results/4d-ux-' + revision + '-attempt-' + process.env.EXPECTED_RUN_ATTEMPT);
            assert.equal(files.length, 1, 'Missing or ambiguous ' + revision + ' UX evidence');
            const bytes = fs.readFileSync(files[0]);
            const result = JSON.parse(bytes);
            const proofs = find('results/4d-ux-' + revision + '-attempt-' + process.env.EXPECTED_RUN_ATTEMPT, 'integration-browser-proof.json');
            assert.equal(proofs.length, 1, 'Fresh proof required for ' + revision);
            const proof = JSON.parse(fs.readFileSync(proofs[0], 'utf8'));
            assert.equal(proof.runId, process.env.EXPECTED_RUN_ID);
            assert.equal(proof.attempt, process.env.EXPECTED_RUN_ATTEMPT);
            assert.equal(proof.revision, revision);
            assert.equal(proof.harnessCommit, process.env.EXPECTED_HEAD_SHA);
            assert.equal(proof.commit, process.env[revision === 'base' ? 'EXPECTED_BASE_SHA' : 'EXPECTED_HEAD_SHA']);
            assert.equal(proof.resultSha256, crypto.createHash('sha256').update(bytes).digest('hex'));
            assert.ok(Date.parse(result.date) >= proof.startedAt && proof.finishedAt >= Date.parse(result.date));
            assert.ok(Array.isArray(result.results) && result.results.length > 0);
            assert.equal(result.failed, result.results.filter(x => !x.ok).length);
            return { ...result, harnessSha256: proof.harnessSha256 };
          };
          const base = read('base'), head = read('integrated');
          assert.equal(base.harnessSha256, head.harnessSha256, 'Baseline and integration must use the same assertions');
          const names = r => r.results.map(x => x.name).sort();
          assert.deepEqual(names(head), names(base), 'Legacy tests must not disappear');
          const failed = r => r.results.filter(x => !x.ok).map(x => x.name);
          const oldFailures = new Set(failed(base));
          const introduced = failed(head).filter(name => !oldFailures.has(name));
          const text = [
            '## Actual 4D UX browser comparison',
            '- Target baseline: ' + base.passed + ' passed / ' + base.failed + ' failed',
            '- Integration: ' + head.passed + ' passed / ' + head.failed + ' failed',
            '- New failing assertions: ' + introduced.length,
            '',
            'Integration failures (raw matrix jobs intentionally remain failed):',
            ...failed(head).map(name => '- ' + name),
            '',
            'This comparison does not mark legacy failing tests as passed.'
          ].join('\n');
          console.log(text);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n');
          assert.deepEqual(introduced, [], 'New browser regressions');
          JS
