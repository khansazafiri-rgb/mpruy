name: Atlas SIO source label quarantine audit
on:
  pull_request:
    branches: [feat/atlas-spl-knee-intake-20261125]
permissions:
  contents: read
jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: 'python -m pip install --only-binary=:all: numpy==1.26.4 pillow==11.3.0 openpyxl==3.1.5'
      - run: |
          python scripts/audit-sio-source-metadata.py --test
          python scripts/audit-sio-label-volume.py --test
      - name: Check official Zenodo record metadata
        run: python scripts/audit-sio-source-metadata.py
      - name: Replay checksummed labels only
        if: ${{ !cancelled() }}
        run: python scripts/audit-sio-label-volume.py
