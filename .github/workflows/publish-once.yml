name: Assemble reviewed Anatomy source only
on:
  push:
    branches: [handoff/anatomy-visual-learning]
permissions:
  contents: read
jobs:
  assemble:
    if: github.ref == 'refs/heads/handoff/anatomy-visual-learning'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore and verify reviewed preview assets
        run: node tools/restore-previews-once.mjs
      - name: Complete missing cross-platform lock entries
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Record the Linux-compatible lockfile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const file='SOURCE-MANIFEST.json',manifest=JSON.parse(fs.readFileSync(file));
          manifest.files['package-lock.json']=createHash('sha256').update(fs.readFileSync('package-lock.json')).digest('hex');
          manifest.publicationFix='Complete missing optional native dependency entries for a reproducible Linux npm ci; runtime source and GLBs unchanged.';
          fs.writeFileSync(file,JSON.stringify(manifest,null,2)+'\n');
          NODE
      - run: npm run lint
      - run: npm test
      - run: npm run build -- --base=/anatomy/viewer/
      - name: Commit complete reviewed source on handoff branch
        run: |
          node tools/restore-previews-once.mjs
          rm -r handoff-assets
          rm tools/restore-previews-once.mjs .github/workflows/publish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete reviewed Anatomy handoff with verified mesh previews'
          git push origin HEAD:refs/heads/handoff/anatomy-visual-learning
