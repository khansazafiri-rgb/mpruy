name: Atlas HRA exact source group hierarchy audit
on:
  push:
    branches: [feat/atlas-hra-group-hierarchy-20261126]
  pull_request:
    branches: [feat/atlas-hra-cardiopulmonary-four-20261126]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/audit-hra-source-groups.test.mjs
      - run: node scripts/audit-hra-source-groups.mjs
