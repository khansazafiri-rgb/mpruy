name: Build official BodyParts3D bulk geometry candidates (review only)

on:
  pull_request:
    branches:
      - feature/4d-lab-official-logo-guided-tour
    paths:
      - licensing/tools/prepare-bodyparts3d-source.mjs
      - apps/4d-lab/tools/batch-bp3d-candidates.mjs
      - apps/4d-lab/tools/build-bp3d-candidate.mjs
      - apps/4d-lab/tools/review-bp3d-candidate.mjs
      - apps/4d-lab/test/bp3d-batch.test.mjs
      - apps/4d-lab/test/bp3d-review.test.mjs
      - apps/4d-lab/test/bp3d-convert.test.mjs
      - .github/workflows/bodyparts3d-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-source-bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install 4D Lab geometry-conversion dependencies
        run: npm ci --prefix apps/4d-lab
      - name: Test official-source mapping, OBJ conversion and full batch
        run: node --test apps/4d-lab/test/bp3d-batch.test.mjs apps/4d-lab/test/bp3d-convert.test.mjs apps/4d-lab/test/bp3d-review.test.mjs scripts/bodyparts3d-source.test.mjs
      - name: Download source once and fingerprint exact official ZIP and mapping tables
        run: npm run audit:bodyparts3d -- --download
      - name: Process all direct FMA/FJ matches in one run (no public release)
        run: npm run batch:bodyparts3d -- --all
      - name: Upload all converted GLBs, viewer, mapping gaps and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: bp3d-bulk-review-unapproved
          path: local-data/licensing-quarantine/bp3d-batch/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
      - name: Summarize bulk coverage without claiming rights clearance
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='local-data/licensing-quarantine/bp3d-batch/inventory.json';
          const report=JSON.parse(fs.readFileSync(file,'utf8'));
          const s=report.summary;
          const lines=['## MEDCOEL official BodyParts3D — bulk source review only',
            '| Metric | Count |','| --- | ---: |',
            '| Retained Atlas catalog | '+s.catalogCount+' |',
            '| Direct FMA + FJ candidate names | '+s.directlyMappable+' |',
            '| GLBs actually converted | '+s.converted+' |',
            '| Conversion failures | '+s.failed+' |',
            '| Unmapped/ambiguous/missing file | '+s.gaps+' |',
            'All outputs are independent **review-only** files. This workflow does not change the approved 3D Anatomy UI, current GLBs, 4D Lab CT/USG, production routes or commercial release gates.',
            'Download the review artifact and open index.html through a localhost static server to inspect candidates in one interface.',
            'The separate mapping-gaps.json contains suggestions (NOT verified anatomy identities).'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          if(s.failed){console.error('Some candidates failed conversion; see artifact/inventory.json');process.exitCode=1;}
          JS
