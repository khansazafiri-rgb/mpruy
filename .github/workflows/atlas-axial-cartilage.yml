name: Atlas 4.3 axial cartilage dual-source audit
on:
  pull_request:
    branches: [feat/atlas-reference-regions-20261125]
    paths:
      - 'licensing/atlas-publication/bp3d43-*-candidates.json'
      - 'scripts/audit-bp3d43-gap-batch*.mjs'
      - '.github/workflows/atlas-axial-cartilage.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        batch: [discs-23, costal-20]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/intake-bp3d43-priority-elements.test.mjs scripts/audit-bp3d43-mirror-elements.test.mjs scripts/audit-bp3d43-gap-batch.test.mjs
      - name: Compare official publisher and pinned mirror source geometry
        env:
          AUDIT_BATCH: ${{ matrix.batch }}
        run: node scripts/audit-bp3d43-gap-batch.mjs "$AUDIT_BATCH"
      - name: Remove private temporary geometry
        if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-* local-data/licensing-quarantine/bp3d43-mirror-audit-*
