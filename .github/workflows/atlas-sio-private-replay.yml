name: Atlas SIO isolated source label verification
on:
  push:
    branches: [feat/atlas-sio-label-replay-20261126]
  pull_request:
    branches: [feat/atlas-cns-30-20261126]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: numpy==1.26.4 pillow==11.3.0 openpyxl==3.1.5
      - name: Run label-only fixture safety tests
        run: |
          python scripts/audit-sio-source-metadata.py --test
          python scripts/audit-sio-label-volume.py --test
      - name: Check publisher metadata and exact label volume independently
        run: |
          set +e
          python scripts/audit-sio-source-metadata.py
          metadata_status=$?
          python scripts/audit-sio-label-volume.py
          label_status=$?
          echo "SIO independent status metadata=$metadata_status labels=$label_status"
          if [ "$metadata_status" -ne 0 ] || [ "$label_status" -ne 0 ]; then exit 1; fi
