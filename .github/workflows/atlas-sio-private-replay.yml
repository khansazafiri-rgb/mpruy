name: Atlas SIO private label replay
on:
  push:
    branches: [feat/atlas-sio-label-replay-20261126]
  pull_request:
    branches: [feat/atlas-cns-30-20261126]
    paths:
      - 'scripts/audit-sio-*.py'
      - 'licensing/atlas-publication/sio-visible-human-source-candidate.json'
      - '.github/workflows/atlas-sio-private-replay.yml'
permissions:
  contents: read
jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: numpy==1.26.4 pillow==11.3.0 openpyxl==3.1.5
      - run: |
          python scripts/audit-sio-source-metadata.py --test
          python scripts/audit-sio-label-volume.py --test
      - name: Check official Zenodo record metadata
        run: python scripts/audit-sio-source-metadata.py
      - name: Replay checksummed labels only
        if: ${{ !cancelled() }}
        run: python scripts/audit-sio-label-volume.py
