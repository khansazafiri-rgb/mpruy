name: Atlas lower limb source quarantine audit
on:
  push:
    branches: [feat/atlas-lower-limb-source-audit-20261126]
  pull_request:
    branches: [feat/atlas-sio-label-replay-20261126]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit-open3dmodel-lower-limb.py --test
      - name: Inspect pinned observed current byte pair, not legacy or approved source
        run: python scripts/audit-open3dmodel-lower-limb.py --inspect-observed
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/audit-open3dmodel-draco-nerves.test.mjs
      - name: Install isolated pinned Draco decoder for quarantine-only inspection
        run: npm install --prefix "$RUNNER_TEMP/draco-audit" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund draco3dgltf@1.5.7
      - name: Decode exact 13 source nerve candidates without exporting geometry
        run: |
          export DRACO_AUDIT_MODULE="$RUNNER_TEMP/draco-audit"
          python scripts/audit-open3dmodel-lower-limb.py --decode-observed-private
