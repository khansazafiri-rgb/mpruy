name: Atlas 36 component private browser and learning regression
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
    paths:
      - '.github/workflows/atlas-components-browser.yml'
      - 'scripts/atlas-components-36.test.mjs'
      - 'apps/atlas-independent/src/reference-challenge-component-language.js'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/atlas-independent --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/atlas-components-36.test.mjs
      - run: npm test --prefix apps/atlas-independent
      - run: node scripts/replay-audited-bp3d43-suite.mjs --receipt=bp3d43-checkpoint-components-36-dual-source-audit-20261126.json
      - run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-browser/node_modules/playwright"
          ATLAS_TEST_REAL43=components-36 node scripts/test-private-atlas-browser.mjs
      - if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-*
