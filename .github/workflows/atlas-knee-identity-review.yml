name: Atlas SPL knee pinned identity and geometry review
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
    paths:
      - 'scripts/audit-spl-knee-geometry.py'
      - '.github/workflows/atlas-knee-identity-review.yml'
permissions:
  contents: read
jobs:
  pinned-knee-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: 'python -m pip install --only-binary=:all: numpy==1.26.4 vtk==9.3.1'
      - run: python scripts/audit-spl-knee-source.py --test
      - run: python scripts/audit-spl-knee-geometry.py --test
      - run: python scripts/audit-spl-knee-geometry.py
