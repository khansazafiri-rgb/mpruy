name: Video catalog

on:
  push:
    paths:
      - "video/**"
      - "brand/video/**"
      - "scripts/video/update_catalog.py"
      - "docs/VIDEO_KATALOG.md"
      - ".github/workflows/video-catalog.yml"
  pull_request:
    paths:
      - "video/**"
      - "brand/video/**"
      - "scripts/video/update_catalog.py"
      - "docs/VIDEO_KATALOG.md"
      - ".github/workflows/video-catalog.yml"

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every finished video is listed
        run: python3 scripts/video/update_catalog.py --check
