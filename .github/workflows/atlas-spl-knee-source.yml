name: Atlas SPL knee source quarantine inventory
on:
  pull_request:
    branches: [feat/atlas-axial-cartilage-20261125]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/audit-spl-knee-source.py --test
      - name: Inspect official archive without extraction or publishing
        run: python3 scripts/audit-spl-knee-source.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned VTK audit dependencies
        run: 'python -m pip install --only-binary=:all: numpy==1.26.4 vtk==9.3.1'
      - name: Test native geometry and exact GLB roundtrip
        run: python scripts/audit-spl-knee-geometry.py --test
      - name: Parse pinned 48 native VTK meshes and audit geometry-only GLB in memory
        run: python scripts/audit-spl-knee-geometry.py
