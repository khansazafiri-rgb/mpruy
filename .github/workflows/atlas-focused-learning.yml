name: Atlas focused learning regression
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
  pull_request:
    branches: [feat/atlas-multilingual-coverage-20261126]
# Supersede only an older revision of the same workflow on the same ref.
concurrency:
  group: atlas-focused-learning-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/atlas-independent --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix apps/atlas-independent
      - name: Verify exact checkpoint coverage and component-only references
        run: node --test scripts/independent-atlas-learning-coverage.test.mjs
      - run: node scripts/intake-bp3d43-priority-elements.mjs
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          # GitHub-hosted Ubuntu images already provide Chromium runtime libraries.
          # Do not refresh unrelated apt repositories (Microsoft returned HTTP 403).
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install chromium
          node --input-type=commonjs -e 'const {chromium}=require(process.env.RUNNER_TEMP+"/atlas-browser/node_modules/playwright"); (async()=>{const b=await chromium.launch({headless:true}); await b.close();})().catch(e=>{console.error(e);process.exit(1)})'
      - name: Focused source-reference browser replay
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-browser/node_modules/playwright"
          ATLAS_TEST_REAL43=1 node scripts/test-private-atlas-browser.mjs
      - name: Remove temporary source geometry
        if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-*
