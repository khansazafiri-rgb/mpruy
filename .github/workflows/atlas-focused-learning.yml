name: Atlas focused learning regression
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
  pull_request:
    branches: [feat/atlas-multilingual-coverage-20261126]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/atlas-independent --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix apps/atlas-independent
      - run: node scripts/intake-bp3d43-priority-elements.mjs
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Focused source-reference browser replay
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-browser/node_modules/playwright"
          ATLAS_TEST_REAL43=1 node scripts/test-private-atlas-browser.mjs
      - name: Remove temporary source geometry
        if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-*
