name: Atlas official-source geometry audit
on:
  pull_request:
    branches: [claude/focused-wozniak-1ayrxa]
    paths:
      - 'scripts/audit-official-atlas-live-source.mjs'
      - '.github/workflows/atlas-official-source-audit.yml'
permissions:
  contents: read
concurrency:
  group: atlas-official-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - name: Fresh publisher bytes and actual geometry replay
        run: node scripts/audit-official-atlas-live-source.mjs --all-resolved
