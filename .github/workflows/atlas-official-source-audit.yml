name: Atlas official-source geometry audit
on:
  pull_request:
    branches: [claude/focused-wozniak-1ayrxa]
    paths:
      - 'scripts/audit-official-atlas-live-source.mjs'
      - 'scripts/audit-bp3d-archive-drift.py'
      - 'scripts/audit-bp3d-release-members.py'
      - 'scripts/bp3d-publisher-revisions*'
      - 'scripts/reconstruct-bp3d-retained-obj*'
      - 'licensing/atlas-publication/checkpoint-evidence/bp3d40-*'
      - '.github/workflows/atlas-official-source-audit.yml'
permissions:
  contents: read
concurrency:
  group: atlas-official-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - name: Verified publisher revision and rejection tests
        run: |
          python3 scripts/audit-bp3d-archive-drift.py --test
          python3 scripts/reconstruct-bp3d-retained-obj.test.py
          node --test scripts/bp3d-publisher-revisions.test.mjs
      - name: Fresh publisher source bytes for all ISA and retained release PART-OF members
        run: |
          python3 scripts/audit-bp3d-release-members.py --test
          python3 scripts/audit-bp3d-release-members.py
