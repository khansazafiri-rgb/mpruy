name: Atlas pinned HRA United DVC candidate geometry audit
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
    paths:
      - 'scripts/audit-hra-united-dvc.py'
      - 'licensing/atlas-publication/hra-united-pelvis-mouth-gap-discovery-20261127.json'
      - '.github/workflows/atlas-hra-united-dvc.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-hra-united-dvc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [united-female, united-male]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: 'python -m pip install --only-binary=:all: numpy==1.26.4'
      - run: python scripts/audit-hra-united-dvc.py --test
      - run: python scripts/audit-hra-united-dvc.py ${{ matrix.source }}
