name: Lab ingestion sampling
on:
  pull_request:
    paths:
      - 'tools/lab-ingest/**'
      - '.github/workflows/lab-ingest.yml'
  push:
    branches: [main]
    paths:
      - 'tools/lab-ingest/**'
      - '.github/workflows/lab-ingest.yml'
jobs:
  offline-sampling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r tools/lab-ingest/requirements.txt
      - name: Synthetic sampler and importer safety tests (no downloads/API)
        run: |
          python -m unittest discover -s tools/lab-ingest -p test_sampling.py -v
          python -m unittest discover -s tools/lab-ingest -p test_pack_resolution.py -v
          python -m unittest discover -s tools/lab-ingest -p test_bloodmnist.py -v
          python -m unittest discover -s tools/lab-ingest -p test_identification_guides.py -v
          python -m unittest discover -s tools/lab-ingest -p test_visual_mnist.py -v
