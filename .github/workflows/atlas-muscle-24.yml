name: Atlas 24 muscular element dual-source audit
on:
  push:
    branches: [feat/atlas-focused-challenge-20261126]
    paths:
      - 'licensing/atlas-publication/bp3d43-muscle-24-candidates.json'
      - 'scripts/audit-bp3d43-gap-batch.mjs'
      - '.github/workflows/atlas-muscle-24.yml'
permissions:
  contents: read
jobs:
  muscle-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/intake-bp3d43-priority-elements.test.mjs scripts/audit-bp3d43-mirror-elements.test.mjs scripts/audit-bp3d43-gap-batch.test.mjs
      - name: Independently acquire and compare 24 source elements
        run: node scripts/audit-bp3d43-gap-batch.mjs muscle-24
      - name: Remove private temporary geometry
        if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-* local-data/licensing-quarantine/bp3d43-mirror-audit-*
