name: Atlas integrated private 72-element regression
on:
  pull_request:
    branches: [feat/atlas-bp3d43-intake-20261125, feat/atlas-integrated-private-20261125]
    paths:
      - 'apps/atlas-independent/**'
      - 'scripts/*bp3d43*'
      - 'scripts/audit-atlas-cross-version-overlap*'
      - 'scripts/preview-independent-atlas.mjs'
      - 'scripts/test-private-atlas-browser.mjs'
      - 'licensing/atlas-publication/bp3d43*'
      - '.github/workflows/atlas-integrated-private.yml'
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/atlas-independent --ignore-scripts --no-audit --no-fund
      - name: Unit and identity regression
        run: |
          npm test --prefix apps/atlas-independent
          node --test scripts/intake-bp3d43-priority-elements.test.mjs scripts/audit-bp3d43-mirror-elements.test.mjs scripts/audit-bp3d43-gap-batch.test.mjs scripts/audit-atlas-cross-version-overlap.test.mjs
      - name: Fresh first batch with exact audited source bytes
        run: node scripts/intake-bp3d43-priority-elements.mjs
      - name: Fresh gap batch with dual-source audit
        run: node scripts/audit-bp3d43-gap-batch.mjs
      - name: Fresh nerve batch with dual-source audit
        run: node scripts/audit-bp3d43-gap-batch.mjs nerves-32
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Combined 72 actual source elements and 10 glossary-bound Challenge questions
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-browser/node_modules/playwright"
          ATLAS_TEST_REAL43=expanded node scripts/test-private-atlas-browser.mjs
      - name: Remove temporary source anatomy
        if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-* local-data/licensing-quarantine/bp3d43-mirror-audit-*
