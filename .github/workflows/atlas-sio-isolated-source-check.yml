name: Atlas independent SIO exact source checks
on:
  push:
    branches: [feat/atlas-hra-group-hierarchy-20261126]
    paths:
      - '.github/workflows/atlas-sio-isolated-source-check.yml'
      - 'scripts/audit-sio-*.py'
      - 'licensing/atlas-publication/sio-visible-human-source-candidate.json'
  pull_request:
    branches: [feat/atlas-hra-cardiopulmonary-four-20261126]
    paths:
      - '.github/workflows/atlas-sio-isolated-source-check.yml'
      - 'scripts/audit-sio-*.py'
      - 'licensing/atlas-publication/sio-visible-human-source-candidate.json'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit-sio-source-metadata.py --test
      - name: Verify Zenodo record license, DOI and pinned file metadata
        run: python scripts/audit-sio-source-metadata.py
  label-volume:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: numpy==1.26.4 pillow==11.3.0 openpyxl==3.1.5
      - run: python scripts/audit-sio-label-volume.py --test
      - name: Verify exact source label workbook and segmentation TIFFs only
        run: python scripts/audit-sio-label-volume.py
