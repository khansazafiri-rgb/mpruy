name: Atlas 4.3 gap batch dual-source audit
on:
  pull_request:
    branches: [feat/atlas-bp3d43-intake-20261125]
    paths:
      - 'scripts/audit-bp3d43-gap-batch*.mjs'
      - 'scripts/intake-bp3d43-priority-elements.mjs'
      - 'scripts/audit-bp3d43-mirror-elements.mjs'
      - 'licensing/atlas-publication/bp3d43-gap-batch-candidates.json'
      - '.github/workflows/atlas-bp3d43-gap-batch.yml'
permissions:
  contents: read
jobs:
  gap-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - name: Existing strict provenance tests
        run: node --test scripts/intake-bp3d43-priority-elements.test.mjs scripts/audit-bp3d43-mirror-elements.test.mjs scripts/audit-bp3d43-gap-batch.test.mjs
      - name: Resolve and replay 28 exact candidate elements
        run: node scripts/audit-bp3d43-gap-batch.mjs
      - name: Remove all private temporary anatomy
        if: always()
        run: rm -rf -- local-data/licensing-quarantine/bp3d43-element-intake-* local-data/licensing-quarantine/bp3d43-mirror-audit-*
