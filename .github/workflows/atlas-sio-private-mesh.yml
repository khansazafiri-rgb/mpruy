name: Atlas SIO private mesh conversion audit
on:
  pull_request:
    branches: [claude/focused-wozniak-1ayrxa]
    paths:
      - 'scripts/audit-sio-*.py'
      - 'licensing/atlas-publication/checkpoint-evidence/sio-label-volume-audit-20261127.json'
      - '.github/workflows/atlas-sio-private-mesh.yml'
permissions:
  contents: read
concurrency:
  group: atlas-sio-mesh-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  private-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: 'python -m pip install --only-binary=:all: numpy==1.26.4 pillow==11.3.0 openpyxl==3.1.5 scipy==1.15.3 scikit-image==0.25.2'
      - name: Synthetic geometry and rejection tests
        run: python scripts/audit-sio-private-mesh.py --test
      - name: Reacquire pinned segmentation and convert private GLBs
        run: python scripts/audit-sio-private-mesh.py --allow-known-source-boundary-hold
      # No asset uploads: only non-identifying numeric audit receipts in job logs.
