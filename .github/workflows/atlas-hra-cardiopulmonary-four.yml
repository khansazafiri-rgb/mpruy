name: Atlas HRA cardiopulmonary four pinned source audit
on:
  push:
    branches: [feat/atlas-hra-cardiopulmonary-four-20261126]
  pull_request:
    branches: [feat/atlas-hra-female-five-20261126]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/audit-hra-female-five.test.mjs
      - name: Compare exact HRA source files and crosswalks
        run: node scripts/audit-hra-female-five.mjs cardiopulmonary-four
      - name: Recheck female source references
        run: node scripts/audit-hra-female-five.mjs female-five
      - run: npm ci --prefix apps/4d-lab --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/atlas-independent --ignore-scripts --no-audit --no-fund
      - name: Private reference unit and route tests
        run: |
          npm test --prefix apps/atlas-independent
          node --test scripts/test-hra-female-private-route.test.mjs
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/atlas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render nine original HRA models and verify 160 mapped node labels
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-browser/node_modules/playwright"
          ATLAS_TEST_HRA_COMBINED=1 node scripts/test-private-atlas-browser.mjs
