<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Pasien tidak sadar di IGD</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --forest:#0A3830; --green:#00A383; --mint:#9DE0BD; --cream:#FBF3E2; --gold:#F8C038; --coral:#E8665F; --ink:#172B38; --red:#D9382F; }
  html,body{margin:0;padding:0;background:#000;}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink);background:#0B1626}
  #root svg.layer{position:absolute;left:0;top:0}
  /* zona aman Instagram/TikTok: atas 240 px, kanan 150 px, bawah 380 px bebas dari teks penting */
  #hook{position:absolute;left:0;top:250px;width:930px;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
  .hk{background:#fff;color:#0B1626;border-radius:22px;padding:12px 28px 14px;font-weight:800;font-size:52px;white-space:nowrap;line-height:1.08;letter-spacing:-.01em;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.28);transform-origin:50% 0%;max-width:880px;box-sizing:border-box}
  .hk.red{background:var(--red);color:#fff}
  .hk.big{font-size:58px}
  #chips{position:absolute;left:0;top:250px;width:930px;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
  .chip{display:inline-flex;align-items:center;gap:18px;background:#fff;border-radius:60px;padding:14px 38px 14px 22px;font-weight:800;font-size:48px;line-height:1.14;letter-spacing:-.01em;color:var(--forest);box-shadow:0 10px 0 rgba(10,56,48,.18);transform-origin:50% 0%;max-width:880px;box-sizing:border-box;text-wrap:balance}
  .chip .ic{width:64px;height:64px;flex:none}.chip .ic svg{width:100%;height:100%;display:block}
  .chip.law{background:var(--forest);color:#fff;font-size:40px;padding:12px 34px;border-radius:30px;flex-direction:column;gap:2px;align-items:center}
  .chip.law small{font-size:30px;font-weight:700;color:var(--mint)}
  .chip.red{background:var(--red);color:#fff}
  .chip.green{background:#00A383;color:#fff}
  .chip.gold{background:#F8C038;color:#0A3830}
  #card{position:absolute;left:60px;top:372px;width:870px;height:486px;box-sizing:border-box;padding:22px 30px;display:none;flex-direction:column;justify-content:flex-start;gap:12px;pointer-events:none}
  #cardhead{font-weight:800;font-size:40px;color:#4d6b66;letter-spacing:.01em;text-align:left;margin-bottom:2px}
  #crows{display:flex;flex-direction:column;gap:14px}
  .crow{display:flex;align-items:center;gap:22px;background:#F2F7F6;border-radius:30px;padding:12px 22px 12px 18px;font-weight:800;font-size:44px;line-height:1.1;color:var(--forest);min-height:96px;box-sizing:border-box}
  .crow .ic{width:76px;height:76px;flex:none}.crow .ic svg{width:100%;height:100%;display:block}
  .crow .tx{flex:1}
  .crow .ok{width:60px;height:60px;flex:none;opacity:0;transform:scale(.4);transition:none}.crow .ok svg{width:100%;height:100%}
  .crow.done .ok{opacity:1;transform:scale(1)}
  #stamp{display:none;align-items:center;justify-content:center;gap:16px;background:#00A383;color:#fff;border-radius:26px;padding:16px 26px;font-weight:800;font-size:46px;line-height:1.1;box-shadow:0 8px 0 rgba(0,70,55,.35);align-self:center;transform-origin:50% 50%}
  #stamp .ic{width:64px;height:64px;flex:none}#stamp .ic svg{width:100%;height:100%}
  #why{display:none;align-items:center;justify-content:center;gap:12px;white-space:nowrap;font-weight:800;font-size:36px;color:var(--forest);text-align:center}
  #why .ic{width:56px;height:56px;flex:none}#why .ic svg{width:100%;height:100%}
  #cap{position:absolute;left:60px;width:830px;top:1290px;height:200px;display:flex;align-items:center;justify-content:center}
  #cap .box{background:rgba(8,16,28,.9);border-radius:36px;padding:16px 32px 18px;text-align:center;font-weight:800;font-size:52px;line-height:1.2;color:#fff;letter-spacing:-.01em;max-width:830px;box-sizing:border-box;box-shadow:0 8px 0 rgba(0,0,0,.25);text-wrap:balance}
  #fade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#000;opacity:0;pointer-events:none}
  #end{position:absolute;left:0;top:0;width:1080px;height:1920px;background:var(--cream);opacity:0;pointer-events:none;overflow:hidden}
  #end .blob{position:absolute;border-radius:50%;background:#EAF3E0}
  #end .logo{position:absolute;left:465px;top:280px;width:700px;margin-left:-350px;transform-origin:50% 50%}
  #end .rows{position:absolute;left:0;top:560px;width:930px;display:flex;flex-direction:column;align-items:center;gap:34px}
  #end .erow{display:flex;align-items:center;gap:22px;background:#fff;border-radius:64px;padding:18px 48px 18px 28px;font-weight:800;font-size:54px;line-height:1.1;color:var(--forest);box-shadow:0 12px 0 rgba(10,56,48,.14);transform-origin:50% 50%}
  #end .erow .ic{width:80px;height:80px;flex:none}#end .erow .ic svg{width:100%;height:100%}
  #end .erow.url{background:var(--forest);color:var(--gold);font-size:76px;padding:22px 68px;box-shadow:0 12px 0 rgba(0,0,0,.2)}
</style></head>
<body>
<div id="root">
  <svg id="stage" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920">
    <g id="cam"></g>
    <g id="fx"></g>
  </svg>
  <div id="hook"></div>
  <div id="chips"></div>
  <div id="card"><div id="cardhead"></div><div id="crows"></div><div id="stamp"></div><div id="why"></div></div>
  <div id="cap"><div class="box" id="capbox"></div></div>
  <div id="fade"></div>
  <div id="end">
    <div class="blob" style="left:-160px;top:1150px;width:520px;height:520px"></div><div class="blob" style="left:760px;top:-120px;width:460px;height:460px"></div>
    <img class="logo" id="elogo" src="logo-full.webp" alt="MEDCOEL">
    <div class="rows"><div class="erow" id="er1"></div><div class="erow url" id="er3">medcoel.com</div></div>
    <svg id="endsvg" width="1080" height="1920" style="position:absolute;left:0;top:0"></svg>
  </div>
</div>
<script type="module" src="stage.js"></script>
</body></html>
