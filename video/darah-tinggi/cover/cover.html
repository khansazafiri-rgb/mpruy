<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover: Darah tinggi itu sebahaya apa?</title>
<link rel="stylesheet" href="../stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#c{width:1080px;height:1920px;position:relative;overflow:hidden}svg{display:block}</style></head>
<body><div id="c"></div>
<script type="module">
import { raka, rakaSvg } from '../../../brand/characters/raka/raka.js';
import { createMascot, poseMascot } from '../stage/mascot.js';
import * as A from '../stage/art.js';
import * as H from '../stage/artH.js';
import { armPts, cuffAt, tube } from '../stage/common.js';
await document.fonts.load('800 60px "Plus Jakarta Sans"'); await document.fonts.ready;
const { R, C, E, P, L, T, f1 } = A;
const guide = new URLSearchParams(location.search).has('guide');
const logo = await new Promise(async (r) => { const b = await (await fetch('../stage/logo-full.webp')).blob(); const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const KO = createMascot(await (await fetch('../stage/kori.svg')).text(), 'kori'); poseMascot(KO, { t: 1.2, mood: 'happy', env: 0, wave: 0, arm: -40, phase: 0.5, tilt: 6 });
const STAND = { on: 1, dir: 0, sit: 1, L: { dx: -8, lift: 0, kx: 0 }, R: { dx: 8, lift: 0, kx: 0 } };
const FY = 1560, KK = 0.95, RX = 700, TOP = 1417;
// Raka duduk, lengan terpasang manset dan terulur ke meja, kaget melihat angka tensimeter (merah)
const rs = raka('kaget', 'ulur_lengan', { armL: { roll: 0.72 }, yaw: -0.55, gazeX: -0.9, gazeY: 0.25, tilt: -4, lean: -3, fxBurst: 1 });
const body = `<g transform="translate(${f1(RX - 200 * KK)} ${f1(FY - 778 * KK)}) scale(${KK})">${rakaSvg(rs, { bare: true, uid: 'rc', outfit: 'harian' })}</g>`;
const dots = armPts(rs, 'L', RX, FY, KK).dots, c8 = dots[8];
const cuff = tube(c8[0] - 4, c8[1] + 22, 440, TOP - 62 * 1.6) + cuffAt(rs, RX, FY, KK, 0, 8);
const bg = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6B63"/><stop offset="1" stop-color="#0E3B3F"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/><circle cx="140" cy="560" r="300" fill="rgba(255,255,255,.05)"/><circle cx="960" cy="1150" r="340" fill="rgba(255,255,255,.05)"/>`;
const ST = 'stroke="#0A1A2E" stroke-width="18" paint-order="stroke" stroke-linejoin="round"';
const title = `${T(540, 360, 'DARAH TINGGI', '#fff', 112, ST)}${T(540, 462, 'ITU SEBAHAYA', '#fff', 100, ST)}${T(540, 606, 'APA?', '#F8C038', 150, ST.replace('18', '22'))}`;
// ilustrasi: penampang pembuluh bertekanan (kiri) dan jantung (kanan)
const vessel = `<g>${C(255, 850, 156, 'rgba(0,0,0,.18)')}${H.pressVessel(255, 846, 140, { pr: 0.95, wall: 0.55, t: 0.35 })}${A.R(-0, 0, 0, 0, 'none')}</g>`;
const heart = `<g>${C(850, 850, 150, 'rgba(0,0,0,.14)')}${H.heartCut(850, 860, 0.34, { c: 0.8, hyper: 0.6, t: 0.2 })}</g>`;
const cap = `${H.label(255, 700, 255, 700, '', { a: 0 })}${H.label(150, 960, 36, 1040, 'Pembuluh darah', { anchor: 'start', fs: 28, line: '#F8C038' })}${H.label(880, 960, 1040, 1040, 'Jantung', { anchor: 'end', fs: 28, line: '#fff' })}`;
const arrows = `<g>${A.L('M425 850H615', '#F8C038', 10, 'stroke-dasharray="2 22"')}${T(540, 800, 'tekanan ↑', '#F8C038', 40, 'stroke="#0A1A2E" stroke-width="8" paint-order="stroke"')}</g>`;
const table = H.sideTable(0, 560, TOP);
const dev = H.tensi(250, TOP, 1.7, { mode: 'hasil', sys: 168, dia: 104, hi: true });
const floor = A.R(-100, 1500, 1300, 40, '#C98F5E', 0, 'opacity="0"');
const kori = `<g transform="translate(${f1(940 - 160 * 0.62)} ${f1(1340 - 290 * 0.62)}) scale(0.62)">${KO.root.outerHTML}</g>`;
const ch = H.chair(RX, FY + 6, 220);
const lw = 400, lh = lw * 0.31;
const lg = `<g transform="translate(540 1612)"><rect x="${-lw / 2}" y="${-lh / 2 + 8}" width="${lw}" height="${lh}" rx="${lh / 2}" fill="rgba(0,0,0,.35)"/><rect x="${-lw / 2}" y="${-lh / 2}" width="${lw}" height="${lh}" rx="${lh / 2}" fill="#fff"/><image href="${logo}" x="${-lw * 0.36}" y="${-lw * 0.36 * 0.2015}" width="${lw * 0.72}" height="${lw * 0.72 * 0.2015}"/></g>`;
const flr = A.R(-100, FY + 6, 1300, 400, '#CDBB9E') + A.R(-100, FY + 6, 1300, 12, '#B7A483');
const g = guide ? `<rect x="0" y="0" width="1080" height="240" fill="rgba(255,0,0,.35)"/><rect x="0" y="1680" width="1080" height="240" fill="rgba(255,0,0,.35)"/><rect x="0" y="240" width="1080" height="1440" fill="none" stroke="#0f0" stroke-width="6"/>` : '';
document.getElementById('c').innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920">${bg}${vessel}${heart}${arrows}${cap}${flr}${ch.back}${table}${ch.seat}${dev}${body}${cuff}${kori}${title}${lg}${g}</svg>`;
window.__ready = true;
</script></body></html>
