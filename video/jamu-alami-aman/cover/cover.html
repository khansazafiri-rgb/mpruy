<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover Jamu: alami berarti aman?</title>
<link rel="stylesheet" href="../stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#root{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0B2A3A}#root svg{position:absolute;left:0;top:0}</style></head>
<body><div id="root"><svg id="sc" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script type="module">
// Cover: bingkai flat vector (Raka kanonik, tanpa takarir) + judul tajam. Area aman Reels/TikTok: atas >= 250, bawah <= 1440, kanan <= 940. ?guide = garis area aman.
const q = new URLSearchParams(location.search); await document.fonts.load('800 80px "Plus Jakarta Sans"'); await document.fonts.ready;
const F = "'Plus Jakarta Sans', sans-serif";
const tx = (y, t, f, sz) => `<text x="70" y="${y}" font-family="${F}" font-weight="800" font-size="${sz}" fill="${f}" stroke="rgba(11,42,58,.75)" stroke-width="14" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
let s = `<rect width="1080" height="1920" fill="#F4ECDA"/><image href="hook-nocap.png" x="0" y="470" width="1080" height="1920"/>`;
s += `<rect x="0" y="0" width="1080" height="860" fill="#0B2A3A"/><circle cx="960" cy="140" r="260" fill="#0F4C5C"/>`;
s += `<rect x="70" y="262" width="330" height="96" rx="28" fill="rgba(248,247,243,.97)"/><image href="logo-full.webp" x="90" y="271" width="290" height="78" preserveAspectRatio="xMidYMid meet"/>`;
s += tx(468, 'JAMU: ALAMI', '#FFFFFF', 96) + tx(572, '= PASTI AMAN?', '#F8C038', 96);
s += `<text x="70" y="690" font-family="${F}" font-weight="700" font-size="46" fill="#9DE0BD">Bukti • risiko • cara memilih</text>`;
if (q.has('guide')) s += `<g fill="#FF0066" opacity=".16"><rect width="1080" height="250"/><rect y="1440" width="1080" height="480"/><rect x="940" y="250" width="140" height="1190"/></g><rect y="250" width="940" height="1190" fill="none" stroke="#FF0066" stroke-width="4" stroke-dasharray="14 10"/>`;
document.getElementById('sc').innerHTML = s;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); await new Promise((r) => setTimeout(r, 400)); window.__ready = true;
</script></body></html>
