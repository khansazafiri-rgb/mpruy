<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover Level Up</title>
<link rel="stylesheet" href="../../darah-tinggi/stage/fonts/fonts.css">
<link rel="stylesheet" href="../stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#root{width:1080px;height:1920px;position:relative;overflow:hidden}#root svg{position:absolute;left:0;top:0}</style></head>
<body><div id="root"><svg id="sc" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script type="module">
// Cover: dunia pixel, tangga BAB (BAB 1 emas) dengan Kori melompat girang di atasnya (kiri) dan laptop MEDCOEL dengan tampilan web asli (kanan). Area aman Reels/TikTok: atas >= 250, bawah <= 1440, kanan <= 940. ?guide = garis area aman.
import { f1, MC, FONT } from '../stage/core.js';
import { defs } from '../stage/art.js';
import { loadMascots, mascot } from '../stage/mascot.js';
import { world, block, STAIRS, pxt, pxSpark, confetti, R, T, scan } from '../stage/pix.js';
import { LAPTOP } from '../stage/world.js';
const q = new URLSearchParams(location.search);
await document.fonts.load('800 80px "Plus Jakarta Sans"'); await document.fonts.load('400 80px "Press Start 2P"'); await document.fonts.ready; await loadMascots();
let s = defs() + world(2.0, { scroll: -1612, G: 1260 });
// judul
s += pxt(540, 372, 'POV:', MC.gold, 40, { sw: 12 }) + pxt(540, 500, 'LEVEL UP', MC.gold, 88, { sw: 20 });
s += `<g>${R(100, 548, 460, 70, 'rgba(10,28,36,.95)', 0, `stroke="${MC.gold}" stroke-width="6" shape-rendering="crispEdges"`)}${pxt(330, 596, 'LV 1 > LV 2', MC.ivory, 34, { stroke: false })}</g>`;
// tangga BAB (BAB 1 emas) di kiri + Kori di atas blok pertama
STAIRS.forEach(([cx, cy], i) => { s += block(cx + 20, cy, i + 1, { gold: i === 0 }); });
s += `<ellipse cx="292" cy="1198" rx="110" ry="12" fill="#021014" opacity=".3"/>` + mascot('kori', { x: 292, y: 1196 - 100, s: 1.25, flip: -1, rot: -6, arm: -62, eyes: 'happy', mouth: 'happy', spark: 1 });
s += pxSpark(120, 760, 1.6) + pxSpark(470, 700, 1.1) + confetti(292, 840, 0.5, 22, 12, 520);
// laptop MEDCOEL (kanan) dengan tangkapan web asli
const lx = 560, ly = 700, lw = 350, lh = 480;
s += `<rect x="${lx - 10}" y="${ly - 10}" width="${lw + 20}" height="${lh + 20}" rx="26" fill="#021014" opacity=".35" transform="translate(10 12)"/><rect x="${lx - 14}" y="${ly - 14}" width="${lw + 28}" height="${lh + 28}" rx="28" fill="#1A252E" stroke="${MC.gold}" stroke-width="5"/><clipPath id="clipL"><rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="16"/></clipPath><g clip-path="url(#clipL)"><image href="../rekam/web/materi/f0200.jpg" x="${lx}" y="${ly}" width="${lw}" height="${f1(1800 * lw / 1080)}" preserveAspectRatio="none"/></g>`;
s += R(lx + lw / 2 - 30, ly + lh + 14, 60, 60, '#1A252E') + R(lx - 70, 1228, lw + 140, 30, '#2A3A46', 12);
s += mascot('kila', { x: 800, y: 640, s: 0.55, eyes: 'happy', mouth: 'happy', spark: 1 });
s += `<g>${R(310, 1330, 440, 64, MC.gold, 0, `stroke="${MC.ink}" stroke-width="6" shape-rendering="crispEdges"`)}${pxt(530, 1374, 'SATU BAB DULU.', MC.ink, 24, { stroke: false })}</g>`;
s += scan();
if (q.has('guide')) s += `<g fill="#FF0066" opacity=".16"><rect width="1080" height="250"/><rect y="1440" width="1080" height="480"/><rect x="940" y="250" width="140" height="1190"/></g><rect y="250" width="940" height="1190" fill="none" stroke="#FF0066" stroke-width="4" stroke-dasharray="14 10"/>`;
document.getElementById('sc').innerHTML = s;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); await new Promise((r) => setTimeout(r, 400)); window.__ready = true;
</script></body></html>
