<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover: Cara kerja GCU</title>
<link rel="stylesheet" href="../../darah-tinggi/stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#c{width:1080px;height:1920px;position:relative;overflow:hidden}svg{display:block}</style></head>
<body><div id="c"></div>
<script type="module">
// Cover seri MEDCOEL (judul besar bergaris tinta, Raka beraksi, logo di bawah) dari kode. Judul, wajah Raka, dan logo berada di area aman profil (crop tengah 3:4, y 240-1680).
import { raws, worldPts } from '../stage/shotA.js';
import * as A from '../stage/art.js';
import { f1, MC, FONT } from '../stage/core.js';
await document.fonts.load('800 60px "Plus Jakarta Sans"'); await document.fonts.load('700 30px "Plus Jakarta Sans"'); await document.fonts.ready;
const guide = new URLSearchParams(location.search).has('guide');
const T0 = 3.5;   // saat ujung strip menyentuh tetes dan darah mulai masuk
const R = raws(T0, 'cv'), P = worldPts(T0);
const k = 1.18, RX = 470, FY = 1520;
const toC = (p) => [RX + (p[0] - 200) * k, FY - (778 - p[1]) * k];
const bg = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6B63"/><stop offset="1" stop-color="#0E3B3F"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#g)"/><circle cx="140" cy="560" r="300" fill="rgba(255,255,255,.05)"/><circle cx="960" cy="1150" r="340" fill="rgba(255,255,255,.05)"/>`;
const ST = 'stroke="#0A1A2E" stroke-width="18" paint-order="stroke" stroke-linejoin="round"';
const tx = (x, y, s, c, fs, ex = '') => `<text x="${x}" y="${y}" text-anchor="middle" font-family="${FONT}" font-weight="800" font-size="${fs}" fill="${c}" letter-spacing="-3" ${ex}>${s}</text>`;
const title = tx(540, 350, 'ALAT SEKECIL INI', '#fff', 104, ST) + tx(540, 456, 'BISA TAHU', '#fff', 104, ST) + tx(540, 610, 'GULA DARAH?', '#F8C038', 138, ST.replace('18', '22'));
const floor = `<rect x="-100" y="${FY + 6}" width="1300" height="420" fill="#CDBB9E"/><rect x="-100" y="${FY + 6}" width="1300" height="12" fill="#B7A483"/><ellipse cx="${RX}" cy="${FY + 18}" rx="230" ry="22" fill="rgba(0,0,0,.18)"/>`;
// kaca pembesar: potongan strip dengan darah masuk (skema)
const mc = [820, 960], mr = 175, tip = toC(P.tip);
const dirv = [tip[0] - mc[0], tip[1] - mc[1]], dl = Math.hypot(...dirv), edge = [mc[0] + dirv[0] / dl * (mr + 10), mc[1] + dirv[1] / dl * (mr + 10)];
const mag = `<defs><clipPath id="mclip"><circle cx="${mc[0]}" cy="${mc[1]}" r="${mr}"/></clipPath></defs><circle cx="${mc[0]}" cy="${mc[1] + 8}" r="${mr + 14}" fill="rgba(0,0,0,.22)"/><circle cx="${mc[0]}" cy="${mc[1]}" r="${mr + 10}" fill="#F7F2E4" stroke="#0A1A2E" stroke-width="7"/><g clip-path="url(#mclip)"><rect x="${mc[0] - mr}" y="${mc[1] - mr}" width="${mr * 2}" height="${mr * 2}" fill="#0F4D42"/><g transform="translate(${mc[0]} ${mc[1] - 150}) scale(2.55)">${A.stripSvg({ id: 'cvs', cover: 0.12, fill: 0.78, tint: A.ANALYT.glukosa.warna, tintDark: A.ANALYT.glukosa.gelap, shadow: false })}</g></g>`;
const lead = `<path d="M${f1(edge[0])} ${f1(edge[1])}L${f1(tip[0])} ${f1(tip[1])}" stroke="#0A1A2E" stroke-width="9" stroke-linecap="round" opacity=".55"/><path d="M${f1(edge[0])} ${f1(edge[1])}L${f1(tip[0])} ${f1(tip[1])}" stroke="#F8C038" stroke-width="5" stroke-linecap="round"/><circle cx="${f1(tip[0])}" cy="${f1(tip[1])}" r="11" fill="#F8C038" stroke="#0A1A2E" stroke-width="4"/>`;
const chip = (txt, cx, cy) => { const w = A.chipW(txt, 34); return `<g><rect x="${cx - w / 2 + 4}" y="${cy - 30}" width="${w}" height="60" rx="30" fill="rgba(0,0,0,.28)"/><rect x="${cx - w / 2}" y="${cy - 34}" width="${w}" height="60" rx="30" fill="${MC.ivory}" stroke="#0A1A2E" stroke-width="3"/><text x="${cx}" y="${cy + 8}" text-anchor="middle" font-family="${FONT}" font-weight="700" font-size="34" fill="${MC.ink}">${txt}</text></g>`; };
const dev = toC(P.su([0, 560]));
const devLead = `<path d="M${f1(dev[0])} ${f1(dev[1])}L250 1366" stroke="#0A1A2E" stroke-width="9" stroke-linecap="round" opacity=".55"/><path d="M${f1(dev[0])} ${f1(dev[1])}L250 1366" stroke="#F8C038" stroke-width="5" stroke-linecap="round"/><circle cx="${f1(dev[0])}" cy="${f1(dev[1])}" r="11" fill="#F8C038" stroke="#0A1A2E" stroke-width="4"/>`;
const raka = `<g transform="translate(${RX - 200 * k} ${FY - 778 * k}) scale(${k})">${R.svg}</g>`;
const logo = await new Promise(async (r) => { const b = await (await fetch('../../../apps/web/src/assets/logo-full.webp')).blob(); const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const lw = 420, lh = lw * 0.31;
const lg = `<g transform="translate(540 1603)"><rect x="${-lw / 2}" y="${-lh / 2 + 8}" width="${lw}" height="${lh}" rx="${lh / 2}" fill="rgba(0,0,0,.35)"/><rect x="${-lw / 2}" y="${-lh / 2}" width="${lw}" height="${lh}" rx="${lh / 2}" fill="#fff"/><image href="${logo}" x="${-lw * 0.36}" y="${-lw * 0.36 * 0.2015}" width="${lw * 0.72}" height="${lw * 0.72 * 0.2015}"/></g>`;
const g = guide ? `<rect x="0" y="0" width="1080" height="240" fill="rgba(255,0,0,.35)"/><rect x="0" y="1680" width="1080" height="240" fill="rgba(255,0,0,.35)"/><rect x="0" y="240" width="1080" height="1440" fill="none" stroke="#0f0" stroke-width="6"/>` : '';
document.getElementById('c').innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920">${A.defs()}${bg}${floor}${mag}${raka}${lead}${chip('Strip', mc[0], mc[1] + mr + 64)}${devLead}${chip('Alat GCU', 250, 1400)}${title}${lg}${g}</svg>`;
window.__ready = true;
</script></body></html>
