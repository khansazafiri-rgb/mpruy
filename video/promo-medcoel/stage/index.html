<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>MEDCOEL: Bingung belajar anatomi? (promo)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;background:#000}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Plus Jakarta Sans','Inter',sans-serif;background:#062B25}
  #bg,#ov,#flash{position:absolute;left:0;top:0;display:block}
  #panels{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .panel{position:absolute;overflow:hidden;background:#fff;will-change:transform}
  .panel img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
  #flash{width:1080px;height:1920px;background:#fff;opacity:0;pointer-events:none}
</style></head>
<body>
<div id="root">
  <svg id="bg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="panels"></div>
  <div id="flash"></div>
  <svg id="ov" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
</div>
<script type="module" src="stage.js"></script>
</body></html>
