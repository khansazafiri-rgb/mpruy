<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover Kenapa jari keriput habis berenang?</title>
<link rel="stylesheet" href="../stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#root{width:1080px;height:1920px;position:relative;overflow:hidden}#root svg{position:absolute;left:0;top:0}</style></head>
<body><div id="root"><svg id="sc" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script type="module">
// Cover: ujung jari keriput (tangan berukuran nyata, kamera mendekat) di dalam air + judul. Area aman Reels/TikTok: atas >= 250, bawah <= 1440, kanan <= 940. ?guide = garis area aman.
import { hand } from '../stage/hand.js';
const q = new URLSearchParams(location.search);
await document.fonts.load('800 80px "Plus Jakarta Sans"'); await document.fonts.ready;
const F = "'Plus Jakarta Sans', sans-serif", f1 = (n) => Math.round(n * 10) / 10;
const h = hand(1.7, 1, 0.3), tip = h.G.index[3], mid = h.G.middle[3], sc = 64;
let s = `<defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#37B4D2"/><stop offset=".55" stop-color="#1B8DB5"/><stop offset="1" stop-color="#0B5D86"/></linearGradient><linearGradient id="skinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDB68B"/><stop offset="1" stop-color="#D8946A"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#w)"/>`;
for (let i = 0; i < 14; i++) { const x = (i * 197) % 1100, y = (i * 311) % 1900, rx = 90 + (i * 37) % 130; s += `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${rx * 0.32}" fill="rgba(210,250,255,${0.06 + (i % 3) * 0.02})" transform="rotate(${-18 + i * 7} ${x} ${y})"/>`; }
for (let i = 0; i < 18; i++) { const x = (i * 83 + 40) % 1080, y = 1900 - ((i * 151) % 1700), r = 5 + (i % 5) * 3; s += `<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(235,252,255,.14)" stroke="rgba(255,255,255,.6)" stroke-width="2"/>`; }
s += `<g transform="translate(560 1385) scale(${sc})">${h.svg}</g>`;
s += `<rect width="1080" height="1920" fill="rgba(20,120,170,.08)"/>`;
s += `<rect x="70" y="262" width="330" height="96" rx="28" fill="rgba(248,247,243,.97)"/><image href="logo-full.webp" x="90" y="271" width="290" height="78" preserveAspectRatio="xMidYMid meet"/>`;
s += `<text x="70" y="506" font-family="${F}" font-weight="800" font-size="104" fill="#F8F7F3" stroke="rgba(6,34,43,.55)" stroke-width="10" paint-order="stroke">Kenapa jari</text><text x="70" y="620" font-family="${F}" font-weight="800" font-size="104" fill="#F8F7F3" stroke="rgba(6,34,43,.55)" stroke-width="10" paint-order="stroke">keriput</text><text x="70" y="734" font-family="${F}" font-weight="800" font-size="104" fill="#F8C038" stroke="rgba(6,34,43,.55)" stroke-width="10" paint-order="stroke">habis berenang?</text>`;
s += `<rect x="70" y="1368" width="520" height="62" rx="31" fill="rgba(6,34,43,.82)" stroke="rgba(248,192,56,.8)" stroke-width="3"/><text x="330" y="1409" text-anchor="middle" font-family="${F}" font-weight="800" font-size="28" fill="#EEF9F7">Penjelasan tubuh · ilustrasi</text>`;
if (q.has('guide')) s += `<g fill="#FF0066" opacity=".16"><rect width="1080" height="250"/><rect y="1440" width="1080" height="480"/><rect x="940" y="250" width="140" height="1190"/></g><rect y="250" width="940" height="1190" fill="none" stroke="#FF0066" stroke-width="4" stroke-dasharray="14 10"/>`;
document.getElementById('sc').innerHTML = s;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); await new Promise((r) => setTimeout(r, 400)); window.__ready = true;
</script></body></html>
