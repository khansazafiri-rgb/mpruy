<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover Mata panda = kurang zat besi?</title>
<link rel="stylesheet" href="../stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#root{width:1080px;height:1920px;position:relative;overflow:hidden}#root svg{position:absolute;left:0;top:0}#face{position:absolute;image-rendering:pixelated}</style></head>
<body><div id="root"><svg id="sc" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script type="module">
// Cover: bingkai pixel art Raka (render stage tanpa teks) + judul tajam. Area aman Reels/TikTok: atas >= 250, bawah <= 1440, kanan <= 940. ?guide = garis area aman.
const q = new URLSearchParams(location.search); await document.fonts.load('800 80px "Plus Jakarta Sans"'); await document.fonts.ready;
const F = "'Plus Jakarta Sans', sans-serif";
const tx = (y, t, f, sz) => `<text x="70" y="${y}" font-family="${F}" font-weight="800" font-size="${sz}" fill="${f}" stroke="rgba(7,20,43,.7)" stroke-width="12" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
const k = 0.8, ox = 540 - 540 * k, oy = 520;
let s = `<rect width="1080" height="1920" fill="#0B1F3A"/>`;
s += `<image href="face-nocap.png" x="${ox}" y="${oy}" width="${1080 * k}" height="${1920 * k}" style="image-rendering:pixelated"/>`;
s += `<rect x="70" y="262" width="330" height="96" fill="rgba(248,247,243,.97)"/><image href="logo-full.webp" x="90" y="271" width="290" height="78" preserveAspectRatio="xMidYMid meet"/>`;
s += tx(470, 'MATA PANDA =', '#FFF3DC', 92) + tx(575, 'KURANG ZAT BESI?', '#F8C038', 92);
s += `<rect x="70" y="1330" width="760" height="86" fill="#F8C038" stroke="#07142B" stroke-width="8"/><text x="450" y="1388" text-anchor="middle" font-family="${F}" font-weight="800" font-size="42" fill="#07142B">Tren ‘ferritin face’ • MEDCOEL</text>`;
if (q.has('guide')) s += `<g fill="#FF0066" opacity=".16"><rect width="1080" height="250"/><rect y="1440" width="1080" height="480"/><rect x="940" y="250" width="140" height="1190"/></g><rect y="250" width="940" height="1190" fill="none" stroke="#FF0066" stroke-width="4" stroke-dasharray="14 10"/>`;
document.getElementById('sc').innerHTML = s;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); await new Promise((r) => setTimeout(r, 400)); window.__ready = true;
</script></body></html>
