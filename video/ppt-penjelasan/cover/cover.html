<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover: PPT kuliah bikin bingung?</title>
<link rel="stylesheet" href="../stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#c{width:1080px;height:1920px;position:relative;overflow:hidden}svg{display:block}</style></head>
<body><div id="c"></div>
<script type="module">
import { raka, rakaSvg } from '../../../brand/characters/raka/raka.js';
import { createMascot, poseMascot } from '../stage/mascot.js';
import * as A from '../stage/art.js';
import * as S from '../stage/artS.js';
await document.fonts.load('800 60px "Plus Jakarta Sans"'); await document.fonts.ready;
const { R, C, E, P, L, T, f1 } = A;
const guide = new URLSearchParams(location.search).has('guide');
const dataUrl = async (u) => new Promise(async (r) => { const b = await (await fetch(u)).blob(); const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const logo = await dataUrl('../stage/logo-full.webp'), slide1 = await dataUrl('../stage/media/slide-1.png'), real = await dataUrl('../stage/media/web/baca/f0190.jpg');
const KO = createMascot(await (await fetch('../stage/kori.svg')).text(), 'kori'); poseMascot(KO, { t: 1.4, mood: 'happy', env: 0, wave: 1, phase: 0.5 });
const STAND = { on: 1, dir: 1, L: { dx: 0, lift: 0, kx: 0 }, R: { dx: 0, lift: 0, kx: 0 } };
const FY = 1700, KK = 1.05, RX = 260, DESK = 1450;
const rs = raka('bingung', 'netral', { legs: STAND, gazeX: 0.9, gazeY: -0.5, yaw: 0.35, tilt: -5, sweat: 0.9, bags: 0.1, wide: 0.2, browL: { y: -10, rot: 14 }, browR: { y: -4, rot: -8 }, mouth: { w: 10, up: -2, lo: 10 },
  armL: { wx: 150, wy: 540, ex: 92, ey: 500, finger: 0, front: 1 }, armR: { wx: 250, wy: 540, ex: 308, ey: 500, finger: 0, front: 1 } });
const rk = `<g transform="translate(${f1(RX - 200 * KK)} ${f1(FY - 778 * KK)}) scale(${KK})">${rakaSvg(rs, { bare: true, uid: 'rc', outfit: 'kuliah' })}</g>`;
const bg = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D5E8E"/><stop offset="1" stop-color="#14405F"/></linearGradient><clipPath id="cp"><rect x="0" y="0" width="540" height="300" rx="10"/></clipPath></defs><rect width="1080" height="1920" fill="url(#g)"/><circle cx="140" cy="640" r="300" fill="rgba(255,255,255,.05)"/><circle cx="980" cy="1150" r="340" fill="rgba(255,255,255,.05)"/>`;
// kartu slide (skema buatan), miring
const card = `<g transform="translate(470 690) rotate(3)">${R(-6, 14, 572, 330, 'rgba(0,0,0,.3)', 20)}${R(-8, -8, 576, 332, '#1B2430', 20)}<image href="${slide1}" x="0" y="0" width="560" height="315"/></g>`;
// laptop dengan tampilan Drilling > Materi ASLI (potongan rekaman): penjelasan per slide
const lap = `<g transform="translate(470 1050)">${R(-6, 10, 580, 340, 'rgba(0,0,0,.28)', 24)}${R(-14, -14, 584, 348, '#1B2430', 24)}<g clip-path="url(#cp)"><image href="${real}" x="-770" y="-110" width="1408" height="880"/></g></g>`;
const arrow = `<g transform="translate(750 1008)">${R(-8, 0, 16, 26, '#F8C038', 8)}<path d="M-26 22L0 52L26 22Z" fill="#F8C038"/></g>`;
const fx = S.qm(RX + 180, 840, 0.3, 1.1, 3);
const desk = S.deskTop(DESK) + S.deskFront(DESK);
const ST = 'stroke="#0A1A2E" stroke-width="18" paint-order="stroke" stroke-linejoin="round"';
const title = `${T(540, 340, 'PPT KULIAH', '#fff', 132, ST)}${T(540, 465, 'BIKIN BINGUNG?', '#F8C038', 112, ST.replace('18', '22'))}`;
const sub = `<g transform="translate(540 590) rotate(-2)">${R(-340, -60, 680, 120, 'rgba(0,0,0,.32)', 60, 'transform="translate(0 10)"')}${R(-340, -60, 680, 120, '#E8665F', 60)}${T(0, 24, 'Yuk, pahami per slide!', '#fff', 58)}</g>`;
const ks = 0.66; const kori = `<g transform="translate(${f1(955 - 160 * ks)} ${f1(1505 - 290 * ks)}) scale(${ks})">${KO.root.outerHTML}</g>`;
const lw = 460, lh = lw * 0.31;
const lg = `<g transform="translate(540 1625)"><rect x="${-lw / 2}" y="${-lh / 2 + 8}" width="${lw}" height="${lh}" rx="${lh / 2}" fill="rgba(0,0,0,.35)"/><rect x="${-lw / 2}" y="${-lh / 2}" width="${lw}" height="${lh}" rx="${lh / 2}" fill="#fff"/><image href="${logo}" x="${-lw * 0.36}" y="${-lw * 0.36 * 0.2015}" width="${lw * 0.72}" height="${lw * 0.72 * 0.2015}"/></g>`;
const g = guide ? `<rect x="0" y="0" width="1080" height="240" fill="rgba(255,0,0,.35)"/><rect x="0" y="1680" width="1080" height="240" fill="rgba(255,0,0,.35)"/><rect x="0" y="240" width="1080" height="1440" fill="none" stroke="#0f0" stroke-width="6"/>` : '';
document.getElementById('c').innerHTML = `<svg width="1080" height="1920" viewBox="0 0 1080 1920">${bg}${rk}${desk}${card}${arrow}${lap}${fx}${kori}${title}${sub}${lg}${g}</svg>`;
await new Promise((r) => setTimeout(r, 600));
window.__ready = true;
</script></body></html>
