<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Overlay teks: Masih di lab</title>
<link rel="stylesheet" href="../../darah-tinggi/stage/fonts/fonts.css">
<style>
html,body{margin:0;background:transparent}#root{width:1080px;height:1920px;position:relative;font-family:'Plus Jakarta Sans',system-ui,'Noto Color Emoji',sans-serif}
/* teks putih tebal bertepi hitam, tanpa kotak/panel/latar */
.t{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:#fff;line-height:1.12;white-space:nowrap;
 -webkit-text-stroke:13px #000;paint-order:stroke fill;stroke-linejoin:round;text-shadow:0 5px 0 #000,0 0 14px rgba(0,0,0,.55)}
.t span{white-space:nowrap}
</style></head>
<body><div id="root"></div>
<script>
const P = new URLSearchParams(location.search), k = P.get('k'), dy = +(P.get('dy') || 0), r = document.getElementById('root');
const H = {
  q:  ['top:225px;font-size:62px', 'Temen SMA: ‘Gas nongkrong?’'],
  a:  ['top:1250px;font-size:68px', 'Aku: ‘Bentar, masih di lab.’'],
  p1: ['top:1320px;font-size:64px', 'Lab-nya di laptop:'],
  p2: ['top:1405px;font-size:54px', 'lagi ngulik simulasi USG &amp; CT gratis'],
  p3: ['top:1495px;font-size:66px', 'di medcoel.com 🫠'],
};
const [st, tx] = H[k]; const d = document.createElement('div'); d.className = 't';
d.setAttribute('style', st.replace(/top:(\d+)px/, (m, v) => 'top:' + (+v + dy) + 'px')); d.innerHTML = tx; r.appendChild(d);
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>
