<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Cover Jantung berdetak, tapi pompanya melemah?</title>
<link rel="stylesheet" href="../stage/fonts/fonts.css">
<style>html,body{margin:0;background:#000}#root{width:1080px;height:1920px;position:relative;overflow:hidden}#root svg{position:absolute;left:0;top:0}</style></head>
<body><div id="root"><svg id="sc" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script type="module">
// Cover: bingkai nyata dari rekaman Live 4D Lab (citra CT sintetis, bukan USG/pasien). Area aman Reels/TikTok: atas >= 250, bawah <= 1440, kanan <= 940. ?guide = garis area aman.
const q = new URLSearchParams(location.search); await document.fonts.load('800 80px "Plus Jakarta Sans"'); await document.fonts.ready;
const F = "'Plus Jakarta Sans', sans-serif";
const tx = (y, t, f) => `<text x="70" y="${y}" font-family="${F}" font-weight="800" font-size="96" fill="${f}" stroke="rgba(3,29,24,.6)" stroke-width="10" paint-order="stroke" stroke-linejoin="round">${t}</text>`;
let s = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#031D18"/><stop offset="1" stop-color="#0A4A3E"/></linearGradient><radialGradient id="gl" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#0F7A66" stop-opacity=".5"/><stop offset="1" stop-color="#0F7A66" stop-opacity="0"/></radialGradient><clipPath id="c"><rect x="40" y="810" width="1000" height="556" rx="30"/></clipPath></defs><rect width="1080" height="1920" fill="url(#g)"/><ellipse cx="540" cy="1100" rx="760" ry="640" fill="url(#gl)"/>`;
s += `<rect x="70" y="262" width="330" height="96" rx="28" fill="rgba(248,247,243,.97)"/><image href="logo-full.webp" x="90" y="271" width="290" height="78" preserveAspectRatio="xMidYMid meet"/>`;
s += tx(462, 'JANTUNG', '#fff') + tx(566, 'BERDETAK,', '#fff') + tx(670, 'TAPI POMPANYA', '#fff') + tx(774, 'MELEMAH?', '#7CE0B8');
s += `<g clip-path="url(#c)"><image href="heart.jpg" x="40" y="810" width="1000" height="556" preserveAspectRatio="xMidYMid slice"/></g><rect x="40" y="810" width="1000" height="556" rx="30" fill="none" stroke="rgba(124,224,184,.6)" stroke-width="4"/>`;
s += `<rect x="170" y="1384" width="740" height="50" rx="25" fill="rgba(3,29,24,.92)" stroke="rgba(124,224,184,.7)" stroke-width="2"/><text x="540" y="1418" text-anchor="middle" font-family="${F}" font-weight="700" font-size="26" fill="#fff">Simulasi edukatif, bukan alat diagnosis</text>`;
if (q.has('guide')) s += `<g fill="#FF0066" opacity=".16"><rect width="1080" height="250"/><rect y="1440" width="1080" height="480"/><rect x="940" y="250" width="140" height="1190"/></g><rect y="250" width="940" height="1190" fill="none" stroke="#FF0066" stroke-width="4" stroke-dasharray="14 10"/>`;
document.getElementById('sc').innerHTML = s;
await Promise.all([...document.images].map((i) => i.decode().catch(() => {}))); await new Promise((r) => setTimeout(r, 400)); window.__ready = true;
</script></body></html>
