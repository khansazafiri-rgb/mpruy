<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Masih Dua Minggu</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --forest:#0A3830; --green:#007060; --mint:#9DE0BD; --cream:#F7F2E4; --gold:#F8C038; --coral:#E8665F; --ink:#172B38; --lilac:#8B7BE0; }
  html,body{margin:0;padding:0;background:#000;}
  #root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Plus Jakarta Sans','Inter',sans-serif;color:var(--ink);background:#0A3830}
  #root svg{position:absolute;left:0;top:0;display:block}
  #panel{position:absolute;left:93px;top:188px;width:893px;height:1098px;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 0 0 8px #fff,0 18px 0 8px rgba(10,56,48,.28);opacity:0}
  #panel img{display:block;width:893px;height:1098px;object-fit:cover;object-position:top left}
  #cap{position:absolute;left:70px;width:940px;top:1380px;height:170px;display:flex;align-items:center;justify-content:center;}
  #cap .box{background:rgba(10,56,48,.95);border-radius:34px;padding:16px 30px 18px;text-align:center;font-weight:800;font-size:50px;line-height:1.2;color:#fff;letter-spacing:-.01em;max-width:940px;box-sizing:border-box;text-wrap:balance;box-shadow:0 8px 0 rgba(0,0,0,.18)}
  #cap .box.t{background:#fff;color:#3A2E7A;box-shadow:0 8px 0 rgba(58,46,122,.25)}
  #cap .box.r{background:#DDF5EA;color:#0A3830;box-shadow:0 8px 0 rgba(10,56,48,.22)}
  #cap .tag{display:block;font-size:25px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
  #cap .box.t .tag{color:#8B7BE0} #cap .box.r .tag{color:#007060}
  #cap .w{display:inline-block;margin:0 7px}
  #cap .box .w.on{color:var(--gold)}
  #cap .box.t .w.on,#cap .box.r .w.on{color:#E8665F}
  #cap .box .w.fut{color:rgba(255,255,255,.9)}
  #cap .box.t .w.fut,#cap .box.r .w.fut{color:inherit}
</style></head>
<body>
<div id="root">
  <svg id="world" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="panel"><img id="webimg" alt=""></div>
  <svg id="ui" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="cap"><div class="box" id="capbox"></div></div>
  <svg id="over" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
</div>
<script type="module" src="stage.js"></script>
</body></html>
