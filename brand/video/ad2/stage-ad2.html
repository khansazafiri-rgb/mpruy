<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Panggung video 2 MEDCOEL</title>
<link rel="stylesheet" href="../../../apps/web/src/styles/mascot.css">
<link rel="stylesheet" href="stage-ad2.css">
</head><body>
<div id="stage" class="on-navy">
  <div id="bg" class="bg-navy"></div>
  <div id="scene"></div>
  <div id="title"></div>
  <div id="pov"></div>
  <div id="caption"></div>
  <div id="wipe"></div>
  <div id="grain"></div>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const E = {
    out: (x) => 1 - Math.pow(1 - clamp(x), 3),
    inout: (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    back: (x) => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pop = (l, at, d = .42) => E.back((l - at) / d);
  const fade = (l, at, d = .25) => clamp((l - at) / d);
  const pad = (n) => String(n).padStart(2, '0');
  let D = null; let root = null; let cur = -1; let scn = null; let pending = [];

  function div(cls, html = '', parent = root) { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; parent.append(d); return d; }
  function put(el, { x = 0, y = 0, s = 1, r = 0, o = 1, sx = 1, sy = null } = {}) {
    el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) rotate(${r}deg) scale(${s * sx},${s * (sy ?? 1)})`;
    el.style.opacity = o; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  }
  function setSrc(img, url) { if (img.dataset.u !== url) { img.dataset.u = url; img.src = url; pending.push(img.decode().catch(() => {})); } }
  const sprite = (name, h, parent) => { const i = document.createElement('img'); i.className = 'sprite'; i.style.height = h + 'px'; i.src = `${D.sprites}/${name}.webp`; (parent || root).append(i); pending.push(i.decode().catch(() => {})); return i; };

  // ---------- kartu web: rekaman utuh, diputar 1:1 pada 30 fps (tanpa dipercepat, tanpa dipotong) ----------
  const CARD = { x: 144, y: 200, w: 792, h: 1394 };
  function makeCard(web) {
    const el = div('card'); el.style.width = CARD.w + 'px'; el.style.height = CARD.h + 'px';
    const img = document.createElement('img'); el.append(img);
    let acc = 0;
    const S = web.map((w) => { const c = D.clips[w.clip]; const base = typeof w.from === 'string' ? c.marks[w.from] : (w.from || 0); const seg = { clip: w.clip, frames: c.frames, start: base + (w.off || 0), len: w.len, at: acc }; acc += w.len; return seg; });
    return {
      el, total: acc,
      update(l) {
        let g = S[S.length - 1]; for (const s of S) if (l < s.at + s.len) { g = s; break; }
        const t = Math.min(g.start + (l - g.at), g.frames / 30 - 1 / 30);
        const n = Math.max(1, Math.min(g.frames, Math.floor(t * 30 + 1e-6) + 1));
        setSrc(img, `clips/${g.clip}/${String(n).padStart(5, '0')}.jpg`);
        put(el, { x: CARD.x + CARD.w / 2, y: CARD.y + CARD.h / 2 });
      },
    };
  }

  // ---------- Nilo ----------
  // Semua gerak dihitung dari waktu video (tanpa animasi CSS), jadi mulus dan sama pada tiap render.
  function mkNilo(size) {
    const el = div('mk'); el.style.width = el.style.height = size + 'px';
    const sp = document.createElement('span'); sp.className = 'mc-character is-still mood-idle'; sp.innerHTML = D.mascots.nilo; el.append(sp);
    const q = (s) => el.querySelector(s);
    const float = q('.mc-float'); const arm = q('.mc-arm-right'); const eyesN = q('.mc-eyes-normal'); const sparks = el.querySelectorAll('.mc-spark circle');
    [float, arm, eyesN].forEach((e) => { if (e) e.style.transformBox = 'fill-box'; });
    if (float) float.style.transformOrigin = '50% 92%'; if (arm) arm.style.transformOrigin = '10% 60%'; if (eyesN) eyesN.style.transformOrigin = 'center';
    return {
      el, sp,
      mood(m) { const c = 'mc-character is-still mood-' + m; if (sp.className !== c) sp.className = c; },
      tick(t, { wave = false, jump = 0, squash = 1, tilt = 0 } = {}) {
        const bob = -7 * Math.sin(t * 2 * Math.PI / 3.3);
        if (float) float.style.transform = `translateY(${bob + jump}px) rotate(${tilt}deg) scale(${1 / Math.sqrt(squash)},${squash})`;
        if (arm) arm.style.transform = wave ? `rotate(${-20 * Math.abs(Math.sin(t * 2 * Math.PI / .72))}deg)` : '';
        if (eyesN) eyesN.style.transform = (t % 4.3) < .12 ? 'scaleY(.1)' : '';
        sparks.forEach((c, i) => { c.style.opacity = .55 + .45 * Math.abs(Math.sin(t * 5 + i)); });
      },
      put(o) { put(el, o); },
    };
  }
  function mouth(K, open, speaking) {
    const r = K.el; const normal = r.querySelector('.mc-mouth-normal'); const happy = r.querySelector('.mc-mouth-happy'); const think = r.querySelector('.mc-mouth-think');
    if (!happy) return;
    if (speaking && open > 0) {
      if (normal) normal.style.opacity = 0; if (think) think.style.opacity = 0;
      happy.style.opacity = 1; happy.style.transformBox = 'fill-box'; happy.style.transformOrigin = '50% 0%'; happy.style.transform = `scaleY(${(0.25 + 0.95 * open).toFixed(3)})`;
    } else [normal, think, happy].forEach((e) => { if (e) { e.style.opacity = ''; e.style.transform = ''; } });
  }

  const SPARK = '<svg viewBox="0 0 40 40" width="100%" height="100%"><path d="M20 2q3 15 18 18-15 3-18 18-3-15-18-18 15-3 18-18z" fill="#F8C038" stroke="#172B38" stroke-width="3" stroke-linejoin="round"/></svg>';
  const spark = (size) => { const e = div('spark', SPARK); e.style.width = e.style.height = size + 'px'; return e; };
  const DROP = '<svg viewBox="0 0 40 56" width="100%" height="100%"><path d="M20 3q16 22 16 33a16 16 0 0 1-32 0q0-11 16-33z" fill="#BFE9F5" stroke="#172B38" stroke-width="4" stroke-linejoin="round"/><path d="M12 36q1 8 8 10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>';
  const BULB = '<svg viewBox="0 0 60 80" width="100%" height="100%"><path d="M30 4a22 22 0 0 0-12 40c4 4 4 8 4 12h16c0-4 0-8 4-12A22 22 0 0 0 30 4z" fill="#F8C038" stroke="#172B38" stroke-width="4" stroke-linejoin="round"/><path d="M22 62h16M24 70h12" stroke="#172B38" stroke-width="4" stroke-linecap="round"/></svg>';
  const TROPHY = '<svg viewBox="0 0 120 130" width="100%" height="100%"><path d="M30 10h60v34a30 30 0 0 1-60 0z" fill="#F8C038" stroke="#172B38" stroke-width="6" stroke-linejoin="round"/><path d="M30 18H10q0 28 22 32M90 18h20q0 28-22 32" fill="none" stroke="#172B38" stroke-width="6" stroke-linecap="round"/><path d="M60 74v22M38 104h44v14H38z" fill="#E8A91A" stroke="#172B38" stroke-width="6" stroke-linejoin="round"/><path d="M44 22q0 14 8 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>';
  const BOOK = '<svg viewBox="0 0 140 110" width="100%" height="100%"><path d="M8 18q30-10 62 6 32-16 62-6v78q-30-10-62 6-32-16-62-6z" fill="#fff" stroke="#172B38" stroke-width="6" stroke-linejoin="round"/><path d="M70 24v78" stroke="#172B38" stroke-width="6"/><path d="M22 38q20-5 34 3M22 56q20-5 34 3M84 41q14-8 34-3M84 59q14-8 34-3" fill="none" stroke="#69BFD0" stroke-width="6" stroke-linecap="round"/></svg>';
  const STETH = '<svg viewBox="0 0 120 120" width="100%" height="100%"><path d="M26 10v34a24 24 0 0 0 48 0V10" fill="none" stroke="#172B38" stroke-width="8" stroke-linecap="round"/><path d="M50 68v18a22 22 0 0 0 44 0V70" fill="none" stroke="#172B38" stroke-width="8" stroke-linecap="round"/><circle cx="94" cy="62" r="13" fill="#F8C038" stroke="#172B38" stroke-width="7"/></svg>';
  const ARROW = '<svg viewBox="0 0 30 30" width="100%" height="100%"><path d="M4 2 L4 24 L10 18.5 L14 27 L18 25 L14 16.8 L22 16.5 Z" fill="#fff" stroke="#172B38" stroke-width="2.2" stroke-linejoin="round"/></svg>';
  const icon = (svg, w, h) => { const e = div('abs', svg); e.style.width = w + 'px'; e.style.height = (h ?? w) + 'px'; return e; };
  const stk = (text, cls = '') => div('stk ' + cls, esc(text));
  // stiker yang muncul pada waktu `at` dan hilang pada `until`
  const sticker = (text, cls, x, y, r, at, until = 99) => { const e = stk(text, cls); return { e, update(l) { const a = pop(l, at, .35) * (l < until ? 1 : 0); put(e, { x, y: y + (1 - clamp(a)) * 30, s: Math.max(0, a), r, o: a > 0 ? 1 : 0 }); } }; };

  // ---------- adegan ----------
  const SC = {};
  const NILO_POS = { x: 168, y: 1768, size: 292 };
  const spec = (n) => D.spec.shot[pad(n)];
  function webScene(n, extra) {
    const s = spec(n); const card = makeCard(s.web);
    const nilo = mkNilo(NILO_POS.size); nilo.mood(s.mood);
    const ex = extra ? extra({ card, nilo, s }) : null;
    return {
      speaker: nilo, title: ex && ex.title,
      update(l) {
        card.update(l);
        const e = E.out(l / .5);
        nilo.put({ x: NILO_POS.x, y: NILO_POS.y + (1 - e) * 320 });
        nilo.tick(l + D.spec.shot[pad(n)].start, { wave: s.mood === 'wave', ...(ex && ex.pose ? ex.pose(l) : {}) });
        if (ex && ex.mood) nilo.mood(ex.mood(l));
        ex && ex.update && ex.update(l);
      },
    };
  }

  // Shot 1: kait lucu. Pasien virtual mengetuk pintu, Nilo kaget sampai papan jalan terlempar.
  SC[1] = () => {
    const floor = div('abs'); floor.style.cssText += ';width:1080px;height:640px;background:#BFE3D2;border-top:8px solid #172B38'; 
    const door = div('door'); const knock = ['TOK', 'TOK', 'TOK'].map((t) => { const e = div('fx', t); e.style.fontSize = '86px'; return e; });
    const desk = div('desk'); const cup = div('cup'); const pdf = div('pdfs', '<i></i><i class="s"></i><i></i>');
    const pat = sprite('PAS_kakek_lemas', 800); const bub = div('bub r', 'Dok…?');
    const nilo = mkNilo(520); nilo.mood('idle');
    const sweat = [0, 1, 2].map(() => icon(DROP, 44, 62)); const excl = div('fx', '!'); excl.style.cssText += ';font-size:190px;color:#E5604D;-webkit-text-stroke:10px #172B38;paint-order:stroke fill';
    const sp = [0, 1, 2].map(() => spark(70));
    const clip = icon('<svg viewBox="0 0 120 150" width="100%" height="100%"><rect x="8" y="14" width="104" height="128" rx="14" fill="#fff" stroke="#172B38" stroke-width="7"/><rect x="36" y="4" width="48" height="24" rx="8" fill="#F8C038" stroke="#172B38" stroke-width="6"/><path d="M28 64h64M28 86h64M28 108h40" stroke="#69BFD0" stroke-width="8" stroke-linecap="round"/></svg>', 150, 190);
    return {
      speaker: nilo, full: true,
      update(l) {
        put(floor, { x: 540, y: 1600 });
        put(door, { x: 800, y: 900 + 0, o: 1 });
        const hit = fade(l, .5, .01); // ketukan pertama
        knock.forEach((e, i) => { const t = .35 + i * .22; const a = pop(l, t, .2); put(e, { x: 760 + i * 70, y: 480 - i * 70 + (1 - clamp(a)) * 30, r: -10 + i * 9, s: Math.max(0, a) * (1 + .12 * Math.sin(l * 26)), o: a > 0 && l < 2.2 ? 1 : 0 }); });
        // pasien menyembul dari kanan setelah ketukan
        const pe = E.back((l - .75) / .5); const pw = Math.sin(l * 22) * 5 * fade(l, 1.3, .05);
        put(pat, { x: lerp(1280, 880, clamp(pe)) + pw, y: 1380 - 400 + 20 });
        const be = pop(l, 1.2, .35); put(bub, { x: 780, y: 1010, s: Math.max(0, be), o: be > 0 ? 1 : 0 });
        put(desk, { x: 380, y: 1420 });
        put(cup, { x: 240, y: 1340 + Math.max(0, Math.sin((l - 1.0) * 14)) * -26 * (l > 1 && l < 1.5 ? 1 : 0) });
        // Nilo masuk dari bawah, lalu kaget (lompat + gepeng) saat pasien muncul
        const enter = E.back(l / .55); const shock = l > 1.0 ? clamp((l - 1.0) / .6) : 0;
        const jump = -170 * Math.sin(Math.PI * clamp((l - 1.0) / .55)) * (l < 1.55 ? 1 : 0);
        const squash = l > 1.0 && l < 1.55 ? 1 + .12 * Math.sin(Math.PI * clamp((l - 1.0) / .55)) : (l < .55 ? 1 : 1 + .06 * Math.max(0, Math.sin((l - 1.6) * 9)) * Math.exp(-(l - 1.6) * 3));
        nilo.mood(l < 1.0 ? 'wave' : 'think');
        nilo.put({ x: 330, y: lerp(2200, 1150, clamp(enter)) });
        nilo.tick(l, { wave: l < 1.0, jump, squash, tilt: l > 1.0 ? 4 * Math.sin(l * 12) * Math.exp(-(l - 1) * 2) : 0 });
        put(pdf, { x: 560, y: 1385 + (l > 1.0 ? -Math.min(560, (l - 1.0) * 900) * (l < 1.7 ? 1 : 0) - (l >= 1.7 ? 560 : 0) * 0 : 0), r: l > 1.0 ? (l - 1.0) * 380 : 0, o: l < 2.0 ? 1 : 0 });
        put(clip, { x: 520, y: 1340 - (l > 1.0 ? Math.min(420, (l - 1.0) * 700) : 0), r: l > 1.0 ? -(l - 1.0) * 260 : 0, o: l > 1.0 && l < 2.1 ? 1 : 0 });
        put(excl, { x: 330, y: 700 + (1 - clamp(E.back((l - 1.05) / .3))) * 60, s: Math.max(0, E.back((l - 1.05) / .3)), r: -8, o: l > 1.05 ? 1 : 0 });
        sweat.forEach((e, i) => { const t = 1.3 + i * .22; const k = clamp((l - t) / .8); put(e, { x: 190 + i * 40 + 220 * (i % 2 ? 1 : 0), y: 880 + k * 150, o: l > t ? 1 - k * .6 : 0, s: .9 }); });
        sp.forEach((e, i) => { const t = 1.9 + i * .1; put(e, { x: 120 + i * 190, y: 640 + (i % 2) * 70, s: pop(l, t, .35) * (.9 + .1 * Math.sin(l * 8 + i)), o: l > t && l < 2.9 ? 1 : 0, r: l * 40 }); });
      },
    };
  };

  // Shot 2: halaman depan web + stiker GRATIS
  SC[2] = () => webScene(2, ({ card }) => {
    const g = sticker('GRATIS!', 'coral', 905, 1688, 5, .5); g.e.style.fontSize = '58px';
    const wow = sticker('SEMUA FITUR GRATIS', 'paper', 640, 1688, -3, 1.6); wow.e.style.fontSize = '30px'; wow.e.style.padding = '8px 16px 10px';
    const sp = [0, 1, 2].map(() => spark(64));
    return { update(l) { g.update(l); wow.update(l); sp.forEach((e, i) => { const t = .7 + i * .15; put(e, { x: [995, 90, 1010][i], y: [210, 340, 470][i], s: pop(l, t, .4) * (.9 + .12 * Math.sin(l * 7 + i)), o: l > t ? 1 : 0, r: l * 60 }); }); } };
  });

  // Shot 3: angka naik jadi 38.400 di judul
  SC[3] = () => webScene(3, ({ card }) => {
    const sp = [0, 1, 2, 3].map(() => spark(60));
    return {
      title: (l) => { const v = Math.round(38400 * E.out((l - .05) / 1.3)); return `${new Intl.NumberFormat('id-ID').format(v)} SOAL`; },
      pose: (l) => ({ jump: -26 * Math.max(0, Math.sin(l * 6)) }),
      mood: () => 'cheer',
      update(l) { sp.forEach((e, i) => { const t = 1.3 + i * .12; put(e, { x: [80, 1000, 70, 1005][i], y: [420, 520, 700, 840][i], s: pop(l, t, .4) * (.9 + .12 * Math.sin(l * 7 + i)), o: l > t ? 1 : 0, r: l * 60 }); }); },
    };
  });

  // Shot 4: latihan + pembahasan; bohlam menyala saat pembahasan muncul
  SC[4] = () => webScene(4, ({ card }) => {
    const book = icon(BOOK, 150, 118); const bulb = icon(BULB, 70, 92); const st = sticker('PAHAM!', 'mintc', 880, 1688, 6, 2.4);
    const mk = D.clips.practice.marks;
    return {
      mood: (l) => (l > mk.checked ? 'happy' : 'think'),
      update(l) { put(book, { x: 330, y: 1640 + Math.sin(l * 3) * 4, r: -8, o: 1 }); const b = pop(l, mk.checked + .1, .35); put(bulb, { x: 250, y: 1500, s: Math.max(0, b) * (1 + .06 * Math.sin(l * 12)), o: b > 0 ? 1 : 0 }); st.update(l - 0); },
    };
  });

  // Shot 5: PDF terbang ke kartu chat
  SC[5] = () => webScene(5, ({ card }) => {
    const pdf = div('pdfs', '<i></i><i class="s"></i><i></i>');
    return { mood: () => 'happy', update(l) { const k = E.inout((l - 2.2) / .7); put(pdf, { x: lerp(330, 560, k), y: lerp(1650, 1230, k) - Math.sin(Math.PI * k) * 160, r: -14 + k * 20, s: lerp(.72, .5, k), o: l > 2.2 && l < 3.2 ? 1 - Math.max(0, (l - 2.95) / .25) : (l <= 2.2 ? 1 : 0) }); } };
  });

  // Shot 6: leaderboard, piala
  SC[6] = () => webScene(6, ({ card }) => {
    const tr = icon(TROPHY, 130, 140); const st = sticker('PERINGKAT!', 'paper', 560, 1688, -4, 1.0);
    return { mood: () => 'cheer', update(l) { put(tr, { x: 330, y: 1650 - Math.abs(Math.sin(l * 5)) * 40, r: Math.sin(l * 5) * 6 }); st.update(l); } };
  });

  // Shot 7: pilih poli; Nilo menunjuk
  SC[7] = () => webScene(7, ({ card }) => {
    const st = sticker('POLI APA?', 'mintc', 880, 1688, 6, 1.2); const st2 = sticker('SANTAI / BERWAKTU', 'paper', 640, 1688, -3, 2.8); st2.e.style.fontSize = '26px'; st2.e.style.padding = '6px 12px 8px';
    const ste = icon(STETH, 120, 120);
    return { pose: () => ({}), update(l) { st.update(l); st2.update(l); put(ste, { x: 340, y: 1662 + Math.sin(l * 3) * 5, r: -12 }); } };
  });

  // Shot 8-14: alur simulasi. Stiker kecil menyorot momen penting (waktu dari tanda `sheetN` di rekaman).
  const simMarks = () => D.clips.sim.marks;
  const rel = (name, shot) => (simMarks()[name] ?? 0) - simMarks()[shot];
  SC[8] = () => webScene(8, () => {
    const q = sticker('HMM…', 'paper', 440, 1688, -6, Math.max(.3, rel('sheet1', 's8')), Math.max(.3, rel('sheet1', 's8')) + 1.6);
    const sw = icon(DROP, 40, 56);
    return { mood: () => 'think', update(l) { q.update(l); const t = rel('sheet1', 's8'); put(sw, { x: 270, y: 1640 + clamp((l - t) / .8) * 40, o: l > t && l < t + 1.4 ? 1 : 0 }); } };
  });
  SC[9] = () => webScene(9, () => {
    const st = sticker('LUB-DUB', 'coral', 880, 1688, 6, 1.6); const ste = icon(STETH, 110, 110);
    return { mood: () => 'idle', update(l) { st.update(l); put(ste, { x: 340, y: 1664 + Math.sin(l * 6) * 6, r: -12 }); } };
  });
  SC[10] = () => webScene(10, () => {
    const no = sticker('PESAN SEMUA TES', 'paper', 540, 1688, -2, 3.0); no.e.style.fontSize = '30px'; no.e.style.textDecoration = 'line-through'; no.e.style.textDecorationThickness = '5px'; no.e.style.textDecorationColor = '#E5604D';
    const ok = sticker('SEPERLUNYA', 'mintc', 880, 1688, 4, 3.5); ok.e.style.fontSize = '34px';
    return { mood: (l) => (l > 3.5 ? 'happy' : 'think'), update(l) { no.update(l); ok.update(l); } };
  });
  SC[11] = () => webScene(11, () => {
    const q = sticker('BANDING?', 'paper', 880, 1688, 6, Math.max(.4, rel('sheet1', 's11')));
    return { mood: (l) => (l > 3.4 ? 'happy' : 'think'), update(l) { q.update(l); } };
  });
  SC[12] = () => webScene(12, () => {
    const st = sticker('OTOMATIS!', 'mintc', 870, 1688, 6, .6); const sp = [0, 1].map(() => spark(60));
    return { mood: () => 'happy', update(l) { st.update(l); sp.forEach((e, i) => { const t = 1.0 + i * .2; put(e, { x: [80, 1005][i], y: [560, 820][i], s: pop(l, t, .4) * (.9 + .12 * Math.sin(l * 7 + i)), o: l > t ? 1 : 0, r: l * 50 }); }); } };
  });
  SC[13] = () => webScene(13, () => {
    const st = sticker('WOW!', 'coral', 905, 1688, 6, 1.0); const sp = [0, 1, 2, 3].map(() => spark(64));
    return { mood: () => 'cheer', pose: (l) => ({ jump: -20 * Math.max(0, Math.sin(l * 6)) }), update(l) { st.update(l); sp.forEach((e, i) => { const t = 1.1 + i * .12; put(e, { x: [70, 1010, 60, 1015][i], y: [400, 520, 700, 880][i], s: pop(l, t, .4) * (.9 + .12 * Math.sin(l * 7 + i)), o: l > t ? 1 : 0, r: l * 60 }); }); } };
  });
  SC[14] = () => webScene(14, () => {
    const st = sticker('COBA LAGI?', 'paper', 870, 1688, 6, 1.0);
    return { mood: () => 'wave', update(l) { st.update(l); } };
  });

  // Shot 15: montase pasien fiktif, Nilo mengajak
  SC[15] = () => {
    const P = [['PAS_kakek_lemas', 'Pak Slamet', 'Poli umum', 'Dok, saya lemas…'], ['PAS_anakp_meringis', 'Nadia', 'Poli anak', 'Dok, perut Nadia sakit!'], ['PAS_ibuhamil_cemas', 'Bu Sari', 'Poli kandungan', 'Dok, saya cemas…'], ['PAS_bapak_nyeri', 'Pak Dimas', 'Poli bedah', 'Dok, nyeri sekali!']];
    const cards = P.map(([img, nm, pol]) => { const c = div('pcard', `<span class="pol">${pol}</span><span class="nm">${nm}</span>`); const im = document.createElement('img'); im.className = 'pimg sprite'; im.style.cssText += ';position:absolute;left:50%;bottom:62px;height:380px;filter:none'; im.src = `${D.sprites}/${img}.webp`; c.insertBefore(im, c.firstChild); pending.push(im.decode().catch(() => {})); return c; });
    const bubs = P.map(([, , , t]) => { const b = div('bub', esc(t)); b.style.fontSize = '34px'; b.style.padding = '12px 20px 14px'; b.style.maxWidth = '340px'; return b; });
    const nilo = mkNilo(560); nilo.mood('wave');
    const rb = div('ribbon', 'SEMUA FITUR GRATIS'); const sp = [0, 1, 2, 3].map(() => spark(70));
    const POS = [[300, 520, -5], [780, 520, 5], [300, 980, 4], [780, 980, -4]];
    return {
      speaker: nilo, full: true,
      update(l) {
        cards.forEach((c, i) => { const t = .25 + i * .35; const a = pop(l, t, .42); const [x, y, r] = POS[i]; put(c, { x, y: y + (1 - clamp(a)) * 90 + Math.sin(l * 2 + i) * 4, s: Math.max(0, a), r, o: a > 0 ? 1 : 0 }); });
        bubs.forEach((b, i) => { const t = .6 + i * .35; const a = pop(l, t, .3); const [x, y] = POS[i]; put(b, { x: x + (i % 2 ? -10 : 10), y: y - 290, s: Math.max(0, a) * .9, o: a > 0 && l < t + 1.1 ? 1 : 0, r: i % 2 ? 4 : -4 }); });
        const e = E.out(l / .5); nilo.put({ x: 540, y: lerp(2300, 1400, e) }); nilo.tick(l + spec(15).start, { wave: true });
        const ra = pop(l, 2.2, .4); put(rb, { x: 540, y: 1235, s: Math.max(0, ra), r: -3, o: ra > 0 ? 1 : 0 });
        sp.forEach((s, i) => { const t = 2.4 + i * .1; put(s, { x: [180, 900, 120, 960][i], y: [1260, 1280, 1560, 1540][i], s: pop(l, t, .4) * (.9 + .12 * Math.sin(l * 7 + i)), o: l > t ? 1 : 0, r: l * 60 }); });
      },
    };
  };

  // Shot 16: kartu penutup, ditahan 4 detik
  SC[16] = () => {
    const plate = div('abs'); plate.style.cssText += ';width:860px;height:300px;background:#FFFDF7;border:7px solid #172B38;border-radius:44px;box-shadow:0 12px 0 #172B38';
    const logo = document.createElement('img'); logo.className = 'abs'; logo.src = D.logo; logo.style.width = '700px'; root.append(logo); pending.push(logo.decode().catch(() => {}));
    const nilo = mkNilo(640); nilo.mood('cheer');
    const btn = div('btn', 'COBA SIMULASI'); const cur = icon(ARROW, 96, 96); const free = div('ribbon', 'GRATIS'); const sp = [0, 1, 2, 3, 4].map(() => spark(76));
    return {
      speaker: nilo, full: true,
      update(l) {
        const a = pop(l, .05, .5); put(plate, { x: 540, y: 330, s: Math.max(0, a), o: a > 0 ? 1 : 0 }); put(logo, { x: 540, y: 330, s: Math.max(0, a), o: a > 0 ? 1 : 0 });
        const e = E.out(l / .5); nilo.put({ x: 540, y: lerp(2300, 930, e) }); nilo.tick(l + spec(16).start, { jump: -22 * Math.max(0, Math.sin(l * 5)) });
        const fb = pop(l, .6, .4); put(free, { x: 860, y: 640, s: Math.max(0, fb), r: 10, o: fb > 0 ? 1 : 0 });
        const press = clamp((l - 1.55) / .15) * (1 - clamp((l - 1.75) / .2));
        const ba = pop(l, .9, .45); put(btn, { x: 540, y: 1430 + press * 8, s: Math.max(0, ba) * (1 - .04 * press), o: ba > 0 ? 1 : 0 });
        const k = E.inout((l - .9) / .8); put(cur, { x: lerp(1000, 660, k), y: lerp(1900, 1490, k) + press * 6, o: l > .9 ? 1 : 0, s: 1 - .1 * press });
        sp.forEach((s, i) => { const t = 1.8 + i * .08; const r0 = 1; put(s, { x: [200, 880, 130, 950, 540][i], y: [820, 800, 1180, 1220, 1330][i] - Math.max(0, l - t) * 60, s: pop(l, t, .4) * (.9 + .12 * Math.sin(l * 7 + i)), o: l > t ? 1 : 0, r: l * 60 * r0 }); });
      },
    };
  };

  // ---------- inti ----------
  window.__init = (d) => { D = d; root = $('#scene'); };
  const bgFor = { navy: 'bg-navy', cream: 'bg-cream', mint: 'bg-mint' };
  let wordsFrac = [];
  function enter(i) {
    cur = i; const n = i + 1; const s = spec(n);
    root.innerHTML = ''; pending = [];
    $('#bg').className = bgFor[s.bg] || 'bg-navy';
    $('#stage').className = (s.bg === 'navy' ? 'on-navy' : '') + (SC[n] && s.web.length === 0 ? ' full' : '');
    scn = SC[n]();
    $('#pov').innerHTML = s.pov ? `<div class="note"><i></i><span>${esc(s.pov)}</span></div>` : '';
    const parts = s.teks.join(' ').split(/\s+/); const tot = parts.reduce((a, w) => a + w.length + 1, 0); let acc = 0;
    wordsFrac = parts.map((w) => { const f = acc / tot; acc += w.length + 1; return f; });
    $('#caption').innerHTML = `<div class="pill">${parts.map((w) => `<span class="w">${esc(w)}</span>`).join(' ')}</div>`;
    D.words = parts.length;
  }
  const isFull = (s) => s.web.length === 0;
  window.__frame = (t) => {
    const sh = D.spec.shot; let i = 0;
    for (let k = 1; k <= 16; k++) if (t >= sh[pad(k)].start) i = k - 1;
    if (i !== cur) enter(i);
    const n = i + 1; const s = sh[pad(n)]; const l = t - s.start;
    scn.update(l);
    // judul (bisa dinamis, mis. angka naik)
    const ttl = scn.title ? scn.title(l) : s.overlay;
    const e = pop(l, 0.05, .4);
    $('#title').innerHTML = `<span class="tag" style="transform:scale(${Math.max(0, e)});opacity:${clamp(l / .12)}">${esc(ttl)}</span>`;
    $('#pov .note') && ($('#pov .note').style.opacity = fade(l, .35, .25));
    // takarir mengikuti suara
    const tl = D.timeline.scenes[i]; const sp = clamp((t - tl.audioStart) / tl.audioSec);
    const speaking = t >= tl.audioStart && t <= tl.audioStart + tl.audioSec + .05;
    document.querySelectorAll('#caption .w').forEach((w, k) => { const a = wordsFrac[k]; const b = wordsFrac[k + 1] ?? 1.01; w.className = 'w' + (sp >= b || t > tl.audioStart + tl.audioSec ? ' done' : sp >= a && t >= tl.audioStart ? ' now' : ''); });
    $('#caption').style.opacity = fade(l, .1, .15);
    if (scn.speaker) { const idx = Math.floor((t - tl.audioStart) * D.timeline.fps); const open = tl.env ? (tl.env[idx] || 0) : Math.abs(Math.sin(t * 17)) * (0.6 + .4 * Math.sin(t * 5.3)); mouth(scn.speaker, speaking ? open : 0, speaking); }
    // gelombang peralihan antar shot
    const w = clamp(l / .32); $('#wipe').style.transform = `translateX(${(w * 1180 - 100)}px)`; $('#wipe').style.opacity = w < 1 ? 1 : 0;
    return Promise.all(pending);
  };
})();
</script>
</body></html>
