<!-- volume besar: tinggi dari alpha yang diburamkan, diffuse (kali) + specular (tambah); organ terlihat membulat -->
<filter id="gvol" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="11" diffuseConstant="1.05" lighting-color="#ffffff" result="d"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting>
 <feSpecularLighting in="b" surfaceScale="11" specularConstant=".75" specularExponent="26" lighting-color="#fff6ea" result="s"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting>
 <feComposite in="d" in2="SourceAlpha" operator="in" result="d2"/><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
 <feComposite in="SourceGraphic" in2="d2" operator="arithmetic" k1="1.35" k2="0" k3="0" k4="0" result="lit"/>
 <feComposite in="lit" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".5" k4="0"/>
</filter>
<!-- volume sedang: untuk struktur kecil -->
<filter id="gvolS" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
 <feDiffuseLighting in="b" surfaceScale="6" diffuseConstant="1.05" lighting-color="#ffffff" result="d"><feDistantLight azimuth="225" elevation="50"/></feDiffuseLighting>
 <feSpecularLighting in="b" surfaceScale="6" specularConstant=".7" specularExponent="22" lighting-color="#fff6ea" result="s"><feDistantLight azimuth="225" elevation="50"/></feSpecularLighting>
 <feComposite in="d" in2="SourceAlpha" operator="in" result="d2"/><feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
 <feComposite in="SourceGraphic" in2="d2" operator="arithmetic" k1="1.35" k2="0" k3="0" k4="0" result="lit"/>
 <feComposite in="lit" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".45" k4="0"/>
</filter>
<filter id="gvolV" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
 <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
